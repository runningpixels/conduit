name: CI

on:
  push:
    # Both names are listed so the workflow keeps gating pushes across the
    # master -> main rename rather than silently running on neither.
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # 34 integration tests each link their own binary against Tauri/WebKit.
      # At the dev profile's default `debug = true` that is tens of GB of DWARF
      # and it fills the runner disk mid-link -- ld mmaps its output, so a full
      # filesystem surfaces as SIGBUS in collect2 rather than ENOSPC.
      # line-tables-only keeps panic backtraces with line numbers.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4

      # ~20 GB of preinstalled toolchains this job never touches. Removing them
      # is cheaper than being clever about the link, and `df` on both sides
      # means the next disk failure is legible instead of a bare bus error.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android                       /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      # Clippy and `cargo test` build the desktop crate, which pulls in
      # glib-sys/webkit2gtk-sys -- so this job needs the same system libraries
      # as tauri-build-smoke, not just the ones a pure-Rust workspace would.
      # Without it, clippy dies in the build script with "Package 'glib-2.0'
      # was not found in the pkg-config search path".
      - name: Install Tauri system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y             libwebkit2gtk-4.1-dev             libgtk-3-dev             libayatana-appindicator3-dev             librsvg2-dev             patchelf             build-essential             libssl-dev

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

      - name: Disk space after Rust tests
        if: always()
        run: df -h /

      # Supply-chain gate: fails on a dependency whose license is not on the
      # AGPL-compatible allowlist in deny.toml, on a known security advisory,
      # on a wildcard version requirement, or on a non-crates.io source.
      - name: Dependency audit (cargo-deny)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources

      - name: Regenerate schema bindings
        working-directory: packages/config-schema
        run: pnpm run build

      # C1: fail if the committed TypeScript bindings have drifted from the
      # Rust schema source. Regenerates and asserts the worktree is clean.
      - name: Schema freshness
        working-directory: packages/config-schema
        run: pnpm run check

      - name: Renderer typecheck
        working-directory: apps/desktop
        run: pnpm run check

      # Phase 6 M6.6: vitest (renderer component tests, jsdom) gates merges.
      # Mirrors `pnpm -C apps/desktop test` locally.
      - name: Renderer tests (vitest)
        working-directory: apps/desktop
        run: pnpm test

  # Phase 6 M6.6: catch `tauri.conf.json` / bundler regressions early on every
  # PR. Ubuntu-only, `--debug`, NO signing (the dev updater key is not present
  # here) — this is a config/build smoke, not a release artifact producer. The
  # release workflow (release.yml) does the signed multi-platform build.
  tauri-build-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install Tauri system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            libssl-dev

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: tauri build --debug (no signing)
        working-directory: apps/desktop
        # No TAURI_SIGNING_PRIVATE_KEY → the bundle is unsigned, which is the
        # point of the smoke. A failure here means a tauri.conf.json / bundle
        # regression, not a signing problem.
        #
        # createUpdaterArtifacts is overridden off for this build only. With it
        # on, Tauri refuses to build at all without a private key --
        #   "A public key has been found, but no private key"
        # -- and handing the signing key to a job that also runs on pull
        # requests would put it in reach of anything a fork can propose. The
        # release workflow is where signing belongs; this job only needs to
        # prove the bundle config still builds.
        run: pnpm exec tauri build --debug --config '{"bundle":{"createUpdaterArtifacts":false}}'