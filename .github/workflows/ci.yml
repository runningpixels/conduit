name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt clippy
          rustup default stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

      - name: Regenerate schema bindings
        working-directory: packages/config-schema
        run: npm run build

      # C1: fail if the committed TypeScript bindings have drifted from the
      # Rust schema source. Regenerates and asserts the worktree is clean.
      - name: Schema freshness
        working-directory: packages/config-schema
        run: npm run check

      - name: Renderer typecheck
        working-directory: apps/desktop
        run: npx tsc --noEmit