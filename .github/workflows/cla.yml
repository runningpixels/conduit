name: CLA

# Contributor License Agreement gate. Conduit is AGPL-3.0-only and the copyright
# holder offers a separate commercial license; that dual-license model requires
# one party to hold relicensing rights. See LICENSING.md and CONTRIBUTING.md.
#
# Signatures are stored as a JSON file in a branch of this repository — no
# third-party service holds contributor data.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, closed]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    # Only run for the comment that signs, or for PR events.
    if: |
      github.event_name == 'pull_request_target' ||
      contains(github.event.comment.body, 'I have read the CLA Document and I hereby sign the CLA')
    steps:
      - name: CLA Assistant
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/cla.json'
          path-to-document: 'https://github.com/tobiaz/conduit/blob/main/CLA.md'
          branch: 'cla-signatures'
          allowlist: 'dependabot[bot],github-actions[bot]'
          custom-notsigned-prcomment: |
            Thanks for the pull request!

            Before this can be merged, please sign the
            [Contributor License Agreement](https://github.com/tobiaz/conduit/blob/main/CLA.md).
            It takes one comment — you keep the copyright in your contribution,
            and it lets Conduit continue to be offered under both the AGPL and a
            commercial license. See
            [CONTRIBUTING.md](https://github.com/tobiaz/conduit/blob/main/CONTRIBUTING.md#contributor-license-agreement)
            for the reasoning.

            To sign, reply with exactly:
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All contributors have signed the CLA. Thanks!'
