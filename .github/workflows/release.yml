name: Release

# Phase 6 M6.2 — build + updater-sign + manifest + host. NO OS code-signing.
#
# Triggers:
#   - push tag v*.*.*            → stable release (a prerelease tag like
#     v0.1.0-beta.1 is routed to the beta channel by the `channel` step below)
#   - push branch nightly         → beta release
#   - workflow_dispatch           → manual (pick channel via input)
#   - workflow_call               → reusable; Phase 9 white-label passes
#     `edition` so it can call this per edition without forking the workflow.
#
# Secrets (GitHub Actions secrets, NEVER in the repo):
#   TAURI_SIGNING_PRIVATE_KEY           Ed25519 minisign private key (updater payload)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  Password for the private key (empty ok)
# The matching pubkey is committed in apps/desktop/src-tauri/tauri.conf.json
# (plugins.updater.pubkey) — it is NOT secret.
#
# OS code-signing (macOS notarization / Windows Azure Trusted Signing / Linux
# GPG) is intentionally absent — deferred to Phase 9/10. Bundles ship unsigned
# at the OS level (documented Gatekeeper/SmartScreen first-run trade-off); the
# updater payload itself is still signature-verified via the keypair above.

on:
  push:
    tags: ['v*.*.*']
    branches: ['nightly']
  workflow_dispatch:
    inputs:
      channel:
        description: 'Update channel'
        required: true
        type: choice
        default: stable
        options: [stable, beta]
      edition:
        description: 'Product edition (Phase 9 white-label; consumer by default)'
        required: false
        default: consumer
  workflow_call:
    inputs:
      edition:
        required: false
        type: string
        default: consumer

# Only one release pipeline per tag at a time.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # create the GitHub Release + upload assets

jobs:
  # Resolve the channel + edition once so the matrix and the manifest job agree.
  meta:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.meta.outputs.channel }}
      edition: ${{ steps.meta.outputs.edition }}
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - id: meta
        run: |
          set -euo pipefail
          # Edition: explicit input (workflow_call/dispatch) else consumer.
          EDITION="${{ inputs.edition || 'consumer' }}"
          # Channel: explicit dispatch input > prerelease tag > nightly branch > stable.
          if [ -n "${{ inputs.channel }}" ]; then
            CHANNEL="${{ inputs.channel }}"
          elif [[ "${GITHUB_REF#refs/heads/}" == "nightly" ]]; then
            CHANNEL="beta"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            # A prerelease tag (v1.2.3-beta.1, -rc.1, -nightly) → beta; else stable.
            if [[ "${TAG}" == *-* ]]; then CHANNEL="beta"; else CHANNEL="stable"; fi
          else
            CHANNEL="stable"
          fi
          CHANNEL="${CHANNEL:-stable}"
          # Version: strip a leading v from the tag; nightly → 0.0.0-dev.
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            TAG="${GITHUB_REF#refs/tags/}"
          else
            VERSION="0.0.0-dev"
            TAG="nightly"
          fi
          {
            echo "channel=${CHANNEL}"
            echo "edition=${EDITION}"
            echo "version=${VERSION}"
            echo "tag=${TAG}"
          } >> "$GITHUB_OUTPUT"

  # Build per-platform with tauri-action: compiles, updater-signs each bundle
  # (emits the .sig next to it), and uploads the bundles to a GitHub Release.
  # No notarization / signtool / GPG step — OS signing is deferred.
  build:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            args: '--target x86_64-unknown-linux-gnu'
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          # macos-15-intel, not macos-13: the macOS 13 image was retired on
          # 2025-12-08, and a job asking for a label that no longer exists
          # does not fail -- it queues until the 6-hour timeout. It sat
          # unclaimed for over an hour on every attempt while the other
          # three legs finished in 8-21 minutes. macos-15-intel is GitHub's
          # documented replacement for x86_64 macOS.
          - platform: macos-15-intel
            args: '--target x86_64-apple-darwin'
          - platform: windows-latest
            args: '--target x86_64-pc-windows-msvc'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add build target
        run: rustup target add "$(echo "${{ matrix.args }}" | awk '{print $2}')"

      # Tauri needs the WebKitGTK/GTK development headers to link on Linux.
      # This mirrors the list in ci.yml's tauri-build-smoke job; without it the
      # Linux leg of the matrix fails at link time.
      - name: Install Tauri system dependencies (Linux)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            libssl-dev

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      # tauri.conf.json and Cargo.toml carry fixed versions, so without this
      # the build disagree -- v9.9.9 would still produce 0.1.0 bundles while
      # the manifest job, handed the tag's version, advertised one no artifact
      # carries. Tags only; the nightly branch's 0.0.0-dev is not a real
      # version and its bundles are not meant to be addressable.
      - name: Set the version from the tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: node scripts/set-version.mjs '${{ needs.meta.outputs.version }}'

      # Updater payload signing — the private key never touches the repo.
      - name: Build + sign + release (tauri-action)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # build:web and dev:web are defined in apps/desktop/package.json,
          # not the root one, so tauri-action has to run from there. Without
          # this it runs at the repo root and tauri's beforeBuildCommand dies
          # with ERR_PNPM_RECURSIVE_EXEC_FIRST_FAIL: Command "build:web" not
          # found. ci.yml's tauri-build-smoke passes only because it sets
          # working-directory: apps/desktop before calling tauri directly.
          projectPath: apps/desktop
          # tauri-action picks its package manager by looking for a lockfile
          # inside projectPath. pnpm-lock.yaml is at the workspace root, so it
          # finds none there, falls back to npm, and dies with
          # `npm error Missing script: "tauri"`. Name the runner explicitly.
          # Same invocation ci.yml's tauri-build-smoke uses.
          tauriScript: pnpm exec tauri
          tagName: ${{ needs.meta.outputs.tag }}
          releaseName: 'Conduit ${{ needs.meta.outputs.tag }}'
          releaseBody: 'See release notes. OS bundles are unsigned (first-run Gatekeeper/SmartScreen prompt expected); updater payloads are signature-verified.'
          releaseDraft: false
          prerelease: ${{ needs.meta.outputs.channel == 'beta' }}
          args: ${{ matrix.args }}

      # Upload the updater-signed bundle + .sig as a workflow artifact so the
      # manifest job can read them without querying the GitHub API.
      # The bundles land in the workspace target dir at the repo root, not
      # under src-tauri -- Cargo shares one target/ across the workspace.
      # The old path matched nothing and upload-artifact said so without
      # failing (if-no-files-found: ignore), so the manifest job was being
      # handed an empty directory.
      - name: Upload signed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.platform }}
          path: |
            target/**/release/**/*-setup.exe*
            target/**/release/**/*.app.tar.gz*
            target/**/release/**/*.AppImage*
          if-no-files-found: ignore

  # Generate the Tauri 2 updater manifest from the signed bundles + their .sig
  # files, then attach it to the release. The download URLs use the standard
  # GitHub Releases asset URL pattern (no API query needed).
  manifest:
    needs: [meta, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download all signed artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: bundle-*
          merge-multiple: true

      # Flatten the nested target/**/release/** layout into one dir the manifest
      # scanner can read. Drops the .sig-less files the scanner ignores anyway.
      - name: Flatten artifact tree
        run: |
          set -euo pipefail
          mkdir -p flat
          # Tauri names the macOS bundle Conduit.app.tar.gz on every arch -- the
          # architecture is in the path, not the filename. Copying both macOS
          # legs into one directory therefore collides and one silently
          # overwrites the other, which is how the manifest came out with linux
          # and windows only. Re-attach the arch from the target triple, using
          # the names tauri-action gives the release assets so the URLs resolve.
          find artifacts -type f \( -name '*-setup.exe*' -o -name '*.app.tar.gz*' -o -name '*.AppImage*' \) |
          while read -r f; do
            b=$(basename "$f")
            case "$f" in
              *aarch64-apple-darwin*) b=${b/.app.tar.gz/_aarch64.app.tar.gz} ;;
              *x86_64-apple-darwin*)  b=${b/.app.tar.gz/_x64.app.tar.gz} ;;
            esac
            cp "$f" "flat/$b"
          done
          ls -la flat

      - name: Generate manifest (${{ needs.meta.outputs.channel }})
        env:
          # Standard GH Releases asset URL: .../releases/download/<tag>/<filename>.
          DOWNLOAD_BASE: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ needs.meta.outputs.tag }}
        run: |
          node scripts/generate-update-manifest.mjs \
            --artifacts-dir flat \
            --download-base "$DOWNLOAD_BASE" \
            --version "${{ needs.meta.outputs.version }}" \
            --channel "${{ needs.meta.outputs.channel }}" \
            --out-dir manifest-out \
            --notes "Conduit ${{ needs.meta.outputs.tag }} (${{ needs.meta.outputs.channel }} channel)."

      # Three defects in this workflow produced a green run and a manifest
      # missing platforms: no updater artifacts, an upload glob matching
      # nothing, and two macOS bundles overwriting each other. All silent -- a
      # bundle that is absent looks identical to one never expected. Assert the
      # shape of the release instead of noticing it later.
      - name: Assert the manifest covers every platform
        run: |
          set -euo pipefail
          MANIFEST=manifest-out/${{ needs.meta.outputs.channel }}/manifest.json
          PLATFORMS=$(node -e 'console.log(Object.keys(require(require("path").resolve(process.argv[1])).platforms).sort().join(" "))' "$MANIFEST")
          COUNT=$(echo $PLATFORMS | wc -w)
          echo "manifest lists $COUNT platform(s): $PLATFORMS"
          if [ "$COUNT" -ne 4 ]; then
            echo "::error::expected 4 platforms, got $COUNT"
            exit 1
          fi
      - name: Upload manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: manifest-${{ needs.meta.outputs.channel }}
          path: manifest-out/

      - name: Attach manifest to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          files: manifest-out/${{ needs.meta.outputs.channel }}/manifest.json

  # Publish the per-channel manifest to GitHub Pages, which is the host
  # `tauri.conf.json` endpoints and `updater.rs::UPDATE_BASE` point at:
  #   https://runningpixels.github.io/conduit/<channel>/manifest.json
  #
  # This used to be a manual checklist step. It is automated because a manual
  # step here means the shipped app checks an endpoint that may never have been
  # updated — a silently broken updater is worse than no updater.
  #
  # `keep_files: true` is REQUIRED: the branch holds both stable/ and beta/, and
  # a stable release must not delete the beta manifest (or vice versa).
  pages:
    needs: [meta, manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the generated manifest
        uses: actions/download-artifact@v4
        with:
          name: manifest-${{ needs.meta.outputs.channel }}
          path: manifest-out

      - name: Publish to the gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: manifest-out
          keep_files: true
          commit_message: |
            release: ${{ needs.meta.outputs.channel }} manifest for ${{ needs.meta.outputs.tag }}