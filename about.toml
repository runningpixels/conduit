# cargo-about configuration — generates THIRD-PARTY-NOTICES.md.
#
#   cargo about generate about.hbs > THIRD-PARTY-NOTICES.md
#
# `accepted` is the allowlist of licenses permitted in the dependency tree.
# Every entry here is one-way compatible with AGPL-3.0-only (the project's own
# license). A dependency introducing anything not on this list fails generation
# and must be reviewed before it lands — see LICENSING.md.
accepted = [
    "Apache-2.0",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OpenSSL",          # ring; covered by the LICENSING.md section 7 permission
    "Unlicense",
    "BSL-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "AGPL-3.0-only",    # the workspace crates themselves
]

# Only consider targets we actually ship.
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
]

# Don't fail on crates that are build-only / dev-only for a target we ship.
ignore-build-dependencies = false
ignore-dev-dependencies = true
ignore-transitive-dependencies = false
