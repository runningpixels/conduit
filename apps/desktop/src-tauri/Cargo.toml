[package]
name = "conduit-desktop"
version = "0.1.0"
edition = "2021"
build = "build.rs"
# Tauri runs `cargo run`; with multiple [[bin]] targets we must name the app.
default-run = "conduit-desktop"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
directories = "6.0"
keyring = "3.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.0", features = [] }
thiserror = "2.0"
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1.11", features = ["v4", "serde"] }

# Phase 3 local data: SQLite via sqlx (async, matches the Tokio core).
# `libsqlite3-sys/bundled` ships an embedded SQLite so the Tauri build has no
# system-sqlite link dependency on Windows.
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "sqlite",
  "chrono",
  "uuid",
  "macros",
  "migrate",
] }
libsqlite3-sys = { version = "0.30", features = ["bundled"] }

# Phase 3 M4: content-addressed blob store (attachments/artifacts) needs SHA-256.
sha2 = { version = "0.10", default-features = false }

# Phase 3 M6: encryption-at-rest — AES-256-GCM on targeted columns + blob files.
# Master key is a 256-bit OsRng random value wrapped in the OS keychain (no
# passphrase derivation, so `argon2` is not needed). `base64` encodes the
# `enc:v1:` column prefix; `zeroize` clears the key on drop.
aes-gcm = "0.10"
rand = { version = "0.8", default-features = false, features = ["std", "std_rng"] }
base64 = "0.22"
zeroize = { version = "1.8", features = ["zeroize_derive"] }

# Workspace crates
futures = "0.3"
provider-core = { path = "../../../crates/provider-core" }
tokio-util = { version = "0.7", features = ["rt"] }
mcp-runtime = { path = "../../../crates/mcp-runtime" }

# Phase 4: connector runtime emits redacted child stderr + lifecycle events
# through `tracing`. A subscriber initialized in `main.rs` routes them to the
# process log (per-connector file appender routing is a 04b refinement).
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[[bin]]
name = "generate-migration-fixture"
path = "src/bin/generate_migration_fixture.rs"
