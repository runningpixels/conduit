[package]
name = "conduit-desktop"
description = "Conduit — a local-first, multi-provider desktop AI assistant."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true
build = "build.rs"
# Tauri runs `cargo run`; with multiple [[bin]] targets we must name the app.
default-run = "conduit-desktop"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
directories = "6.0"
keyring = { version = "3.6", features = [
  "windows-native",
  "apple-native",
  "linux-native-async-persistent",
  "crypto-rust",
] }
# keyring v3 ships NO platform backend by default — without these features
# `Entry::new` returns a no-backend error and secrets never reach the OS
# keychain (Windows Credential Manager / macOS Keychain / Secret Service),
# which silently broke Save-provider-key (provider credentials never persisted)
# and the encryption master-key wrap (encryption fell back to `Off`). keyring
# itself target-gates each backend crate (windows-sys / security-framework /
# secret-service+linux-keyutils compile only on their matching OS), so enabling
# all three here is safe — only the current target's backend links. Linux's
# Secret Service path needs an explicit crypto backend; `crypto-rust` keeps it
# pure-Rust (no system OpenSSL dependency, better for bundling). NOTE: do NOT
# add these as `[target.'cfg(...)'.dependencies]` sections inside this table — a
# target header mid-`[dependencies]` captures every following key (serde, tauri,
# sqlx, …) into that target, which on Windows drops `tauri` from the graph and
# breaks the build (missing `cargo:dev` / `DEP_TAURI_DEV`).
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.0", features = [] }
thiserror = "2.0"
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
url = "2"

# Phase 3 local data: SQLite via sqlx (async, matches the Tokio core).
# `libsqlite3-sys/bundled` ships an embedded SQLite so the Tauri build has no
# system-sqlite link dependency on Windows.
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "sqlite",
  "chrono",
  "uuid",
  "macros",
  "migrate",
] }
libsqlite3-sys = { version = "0.30", features = ["bundled"] }

# Phase 3 M4: content-addressed blob store (attachments/artifacts) needs SHA-256.
sha2 = { version = "0.10", default-features = false }

# White-label Mode A, Phase 2: magic-byte sniffing for uploaded logo bytes.
# Already in Cargo.lock transitively (tauri-plugin-updater and tauri-utils
# both pull it in), so promoting it to a direct dependency adds nothing new
# to the supply-chain graph -- see `logo.rs`'s module doc comment.
infer = "0.19"

# Phase 3 M6: encryption-at-rest — AES-256-GCM on targeted columns + blob files.
# Master key is a 256-bit OsRng random value wrapped in the OS keychain (no
# passphrase derivation, so `argon2` is not needed). `base64` encodes the
# `enc:v1:` column prefix; `zeroize` clears the key on drop.
aes-gcm = "0.11"
rand = { version = "0.8", default-features = false, features = ["std", "std_rng"] }
base64 = "0.22"
zeroize = { version = "1.8", features = ["zeroize_derive"] }

# HTTP client for built-in web_fetch and web_search tools
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Cross-platform clipboard for built-in clipboard_read / clipboard_write tools
arboard = "3"
# Workspace file tools: glob matching + secret redaction
glob = "0.3"
regex = "1"

# Workspace crates
futures = "0.3"
provider-core = { path = "../../../crates/provider-core" }
tokio-util = { version = "0.7", features = ["rt"] }
mcp-runtime = { path = "../../../crates/mcp-runtime" }

# Phase 4: connector runtime emits redacted child stderr + lifecycle events
# through `tracing`. A subscriber initialized in `main.rs` routes them to the
# process log (per-connector file appender routing is a 04b refinement).
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Phase 6: consumer release plumbing.
# - `tauri-plugin-updater`: signature-verified auto-update (payload signed with
#   an Ed25519 keypair from `tauri signer generate`; private key in CI secrets,
#   pubkey in `tauri.conf.json`). OS code-signing (notarization/signtool) is
#   deferred to a later phase — bundles ship unsigned with the documented
#   Gatekeeper/SmartScreen trade-off.
# - `tauri-plugin-dialog`: first-run onboarding + the one-time diagnostics
#   disclosure confirmation.
# - `tauri-plugin-shell`: "Reveal in Finder/Explorer" for the diagnostics export
#   path + artifact exports (renderer invokes `reveal_path` Rust command; no
#   `shell:allow-open` in window capability).
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"

# Phase 6: the updater migration precheck copies the live DB to a temp dir.
# Also used by in-crate tests, so it lives in `[dependencies]` (not dev-only).
tempfile = "3"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }
# Phase 6 white-label Mode B: build.rs parses `branding.build.json` to bake
# CONDUIT_ALLOW_USER_BRANDING. Same version as the [dependencies] entry above
# -- Cargo.lock already pins one resolution, this just also compiles it for
# the host target that runs build scripts.
serde_json = "1.0"

[[bin]]
name = "generate-migration-fixture"
path = "src/bin/generate_migration_fixture.rs"
