<meta name="conduit-capability" content="storage — keeps your expenses between launches">
<style>
  html:not([data-theme]), html[data-theme="dark"] {
    --bg:#0b0d12; --surface:#11141b; --surface-hi:#161a23; --line:#1c2130; --line-hi:#262c3c;
    --ink:#e8eaf0; --ink-2:#b8becc; --ink-3:#8990a2; --accent:#ff7a59; --accent-ink:#1a0b06;
    --accent-soft: rgba(255,122,89,.14); --signal:#7cc4ff; --ok:#7cffb2; --warn:#febc2e; --err:#ff9c82;
    color-scheme: dark;
  }
  html[data-theme="light"] {
    --bg:#f6f6f8; --surface:#ffffff; --surface-hi:#f1f2f5; --line:#e1e3ea; --line-hi:#dadce3;
    --ink:#16181d; --ink-2:#3a3f4a; --ink-3:#5f6573; --accent:#4b4ded; --accent-ink:#ffffff;
    --accent-soft:#eef0ff; --signal:#1f86e8; --ok:#137a3a; --warn:#9a5300; --err:#b4380f;
    color-scheme: light;
  }

  html, body {
    background: var(--bg);
    margin: 0;
    padding: 0;
  }

  * { box-sizing: border-box; }

  [hidden] { display: none !important; }

  .bt-app {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink);
    max-width: 640px;
    min-width: 0;
    margin: 0 auto;
    padding: 28px 16px 44px;
  }

  .bt-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }

  .bt-title {
    font-size: 1.35rem;
    font-weight: 650;
    margin: 0 0 4px;
    letter-spacing: -.01em;
  }

  .bt-subtitle {
    margin: 0;
    color: var(--ink-3);
    font-size: .9rem;
  }

  .bt-note {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--ink-3);
    font-size: .78rem;
    background: var(--surface-hi);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 5px 11px;
    white-space: nowrap;
  }

  .bt-note[data-tone="warn"] {
    color: var(--warn);
    border-color: var(--warn);
  }

  .bt-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 22px;
    margin-bottom: 16px;
  }

  .bt-card-title {
    font-size: .82rem;
    font-weight: 650;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin: 0 0 16px;
  }

  input, select, button, textarea { font-family: inherit; }

  .bt-field { display: flex; flex-direction: column; gap: 6px; }

  .bt-field label {
    font-size: .78rem;
    font-weight: 600;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: var(--ink-3);
  }

  .bt-input, select {
    background: var(--surface-hi);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 11px 12px;
    color: var(--ink);
    width: 100%;
    font-size: .95rem;
  }

  .bt-amount-input {
    font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
    font-variant-numeric: tabular-nums;
    font-size: 1.05rem;
  }

  input:focus-visible, select:focus-visible, button:focus-visible {
    outline: 2px solid var(--signal);
    outline-offset: 2px;
  }

  .bt-form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-bottom: 14px;
  }

  .bt-form-grid .bt-field-wide { grid-column: 1 / -1; }

  .bt-amount-row {
    display: flex;
    gap: 8px;
  }

  .bt-currency-select {
    flex: 0 0 74px;
    width: 74px;
  }

  .bt-add-row {
    display: flex;
    justify-content: flex-end;
  }

  button {
    font-family: inherit;
    font-size: .9rem;
    font-weight: 600;
    border-radius: 10px;
    padding: 10px 20px;
    border: 1px solid var(--line);
    background: var(--surface-hi);
    color: var(--ink);
    cursor: pointer;
  }

  button:hover { border-color: var(--line-hi); }
  button:active { transform: translateY(1px); }

  button.bt-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
    min-width: 110px;
  }

  .bt-month-switcher {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin-bottom: 16px;
  }

  .bt-month-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    line-height: 1;
  }

  .bt-month-label {
    font-weight: 650;
    font-size: 1.02rem;
    min-width: 168px;
    text-align: center;
  }

  .bt-settings-row {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    align-items: flex-end;
    margin-bottom: 0;
  }

  .bt-settings-row .bt-field { flex: 1 1 140px; min-width: 120px; }

  .bt-budget-status {
    margin-top: 16px;
  }

  .bt-budget-line {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: .88rem;
    color: var(--ink-2);
    margin-bottom: 8px;
  }

  .bt-budget-line strong {
    font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
    font-size: .95rem;
  }

  .bt-progress-track {
    height: 10px;
    border-radius: 999px;
    background: var(--surface-hi);
    border: 1px solid var(--line);
    overflow: hidden;
  }

  .bt-progress-fill {
    height: 100%;
    border-radius: 999px;
    background: var(--accent);
    transition: width .25s ease, background .25s ease;
  }

  .bt-progress-fill[data-level="warn"] { background: var(--warn); }
  .bt-progress-fill[data-level="err"] { background: var(--err); }

  .bt-total-line {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 14px;
    font-size: .92rem;
    color: var(--ink-2);
  }

  .bt-total-line strong {
    font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
    font-size: 1.15rem;
  }

  .bt-chart {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .bt-chart-row {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .bt-chart-row-top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
  }

  .bt-chart-label {
    font-size: .84rem;
    font-weight: 600;
    color: var(--ink-2);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
  }

  .bt-chart-track {
    height: 18px;
    border-radius: 6px;
    background: var(--surface-hi);
    border: 1px solid var(--line);
    overflow: hidden;
    position: relative;
  }

  .bt-chart-bar {
    height: 100%;
    background: var(--accent);
    border-radius: 5px 0 0 5px;
    min-width: 3px;
    transition: width .25s ease;
  }

  .bt-chart-amount {
    font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
    font-variant-numeric: tabular-nums;
    font-size: .82rem;
    color: var(--ink-2);
    text-align: right;
    white-space: nowrap;
  }

  .bt-empty {
    color: var(--ink-3);
    font-size: .88rem;
    text-align: center;
    padding: 18px 0;
  }

  .bt-entries {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .bt-entry {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--surface-hi);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px 12px;
  }

  .bt-entry-main {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .bt-entry-top {
    display: flex;
    gap: 8px;
    align-items: baseline;
    flex-wrap: wrap;
  }

  .bt-entry-category {
    font-weight: 600;
    font-size: .9rem;
    color: var(--ink);
  }

  .bt-entry-date {
    font-size: .76rem;
    color: var(--ink-3);
  }

  .bt-entry-note {
    font-size: .82rem;
    color: var(--ink-2);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .bt-entry-amount {
    font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
    font-variant-numeric: tabular-nums;
    font-weight: 650;
    font-size: .95rem;
    white-space: nowrap;
  }

  .bt-delete-btn {
    flex: 0 0 auto;
    width: 30px;
    height: 30px;
    padding: 0;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink-3);
    background: transparent;
    border: 1px solid var(--line);
  }

  .bt-delete-btn:hover {
    color: var(--err);
    border-color: var(--err);
  }

  .bt-delete-btn svg { width: 15px; height: 15px; }

  .bt-error {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--surface-hi);
    border: 1px solid var(--err);
    color: var(--err);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: .85rem;
    margin-bottom: 14px;
  }

  .bt-visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }

  @media (max-width: 380px) {
    .bt-title { font-size: 1.2rem; }
    .bt-card { padding: 16px; }
    .bt-form-grid { grid-template-columns: 1fr; }
    .bt-month-label { min-width: 0; font-size: .92rem; }
  }
</style>

<div class="bt-app">
  <header class="bt-header">
    <div>
      <h1 class="bt-title" data-i18n="title">Budget Tracker</h1>
      <p class="bt-subtitle" data-i18n="sub">Track spending by category, month by month</p>
    </div>
    <div class="bt-note" id="bt-storage-note" hidden></div>
  </header>

  <div id="bt-error" class="bt-error" role="alert" hidden></div>

  <div class="bt-card">
    <h2 class="bt-card-title" data-i18n="addExp">Add expense</h2>
    <form id="bt-form" novalidate>
      <div class="bt-form-grid">
        <div class="bt-field">
          <label for="bt-amount" data-i18n="amount">Amount</label>
          <div class="bt-amount-row">
            <select id="bt-currency" class="bt-currency-select" aria-label="Currency" data-i18n-aria="curAria">
              <option value="€">€</option>
              <option value="$">$</option>
              <option value="£">£</option>
              <option value="¥">¥</option>
            </select>
            <input id="bt-amount" class="bt-input bt-amount-input" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00" required />
          </div>
        </div>
        <div class="bt-field">
          <label for="bt-category" data-i18n="cat">Category</label>
          <select id="bt-category" class="bt-input">
            <option value="Groceries" data-i18n="c0">Groceries</option>
            <option value="Housing" data-i18n="c1">Housing</option>
            <option value="Transport" data-i18n="c2">Transport</option>
            <option value="Eating out" data-i18n="c3">Eating out</option>
            <option value="Fun" data-i18n="c4">Fun</option>
            <option value="Health" data-i18n="c5">Health</option>
            <option value="Other" data-i18n="c6">Other</option>
          </select>
        </div>
        <div class="bt-field">
          <label for="bt-date" data-i18n="date">Date</label>
          <input id="bt-date" class="bt-input" type="date" />
        </div>
        <div class="bt-field bt-field-wide">
          <label for="bt-note" data-i18n="note">Note (optional)</label>
          <input id="bt-note" class="bt-input" type="text" maxlength="120" placeholder="What was this for?" data-i18n-placeholder="notePh" />
        </div>
      </div>
      <div class="bt-add-row">
        <button type="submit" class="bt-primary" data-i18n="add">Add</button>
      </div>
    </form>
  </div>

  <div class="bt-month-switcher">
    <button type="button" id="bt-prev-month" class="bt-month-btn" aria-label="Previous month" data-i18n-aria="prevM">‹</button>
    <div class="bt-month-label" id="bt-month-label" aria-live="polite">September 2026</div>
    <button type="button" id="bt-next-month" class="bt-month-btn" aria-label="Next month" data-i18n-aria="nextM">›</button>
  </div>

  <div class="bt-card">
    <h2 class="bt-card-title" data-i18n="curBud">Currency &amp; budget</h2>
    <div class="bt-settings-row">
      <div class="bt-field">
        <label for="bt-default-currency" data-i18n="cur">Currency</label>
        <select id="bt-default-currency" class="bt-input">
          <option value="€" data-i18n="kE">€ Euro</option>
          <option value="$" data-i18n="kU">$ Dollar</option>
          <option value="£" data-i18n="kG">£ Pound</option>
          <option value="¥" data-i18n="kY">¥ Yen</option>
        </select>
      </div>
      <div class="bt-field">
        <label for="bt-budget" data-i18n="budget">Monthly budget (optional)</label>
        <input id="bt-budget" class="bt-input bt-amount-input" type="number" inputmode="decimal" min="0" step="0.01" placeholder="No budget set" data-i18n-placeholder="budPh" />
      </div>
    </div>
    <div class="bt-budget-status" id="bt-budget-status" hidden>
      <div class="bt-budget-line">
        <span data-i18n="spent">Spent this month</span>
        <strong id="bt-budget-text"></strong>
      </div>
      <div class="bt-progress-track">
        <div class="bt-progress-fill" id="bt-progress-fill"></div>
      </div>
    </div>
  </div>

  <div class="bt-card">
    <h2 class="bt-card-title" data-i18n="byCat">This month by category</h2>
    <div class="bt-total-line">
      <span data-i18n="total">Total spent</span>
      <strong id="bt-total-amount">0.00</strong>
    </div>
    <div class="bt-chart" id="bt-chart"></div>
    <div class="bt-empty" id="bt-chart-empty" data-i18n="none" hidden>No expenses yet this month.</div>
  </div>

  <div class="bt-card">
    <h2 class="bt-card-title" data-i18n="entries">Entries</h2>
    <div class="bt-entries" id="bt-entries"></div>
    <div class="bt-empty" id="bt-entries-empty" data-i18n="noEntries" hidden>No expenses recorded for this month.</div>
  </div>

  <div class="bt-visually-hidden" id="bt-status" aria-live="polite"></div>
</div>

        if (hasStorage) {
          window.conduit.storage.set("expenses:" + monthKey(entryYear, entryMonth), entries)
            .then(function () { state.savedOk = true; updateStorageNote(); })
            .catch(function (err) { state.savedOk = false; showError(errorMessageFor(err)); updateStorageNote(); });
        }
        state.year = entryYear;
        state.month = entryMonth;
        state.entries = entries;
        var m2 = 0;
        entries.forEach(function (e) { if (typeof e.id === "number" && e.id > m2) m2 = e.id; });
        state.nextId = m2 + 1;
        render();
        announce(t("aAddM", { cat: catLabel(entry.category), amount: state.currency + formatAmount(entry.amount), month: monthName(entryYear, entryMonth) }));
      });
    }

    amountEl.value = "";
    noteEl.value = "";
    amountEl.focus();
  });

  prevMonthBtn.addEventListener("click", function () { switchMonth(-1); });
  nextMonthBtn.addEventListener("click", function () { switchMonth(1); });

  defaultCurrencyEl.addEventListener("change", function () {
    state.currency = defaultCurrencyEl.value;
    currencySelectEl.value = state.currency;
    render();
    saveSettings();
  });

  budgetEl.addEventListener("change", function () {
    var value = parseFloat(budgetEl.value);
    state.budget = isFinite(value) && value > 0 ? Math.round(value * 100) / 100 : null;
    render();
    saveSettings();
  });

  function init() {
    applyI18n();
    var now = new Date();
    state.year = now.getFullYear();
    state.month = now.getMonth();
    dateEl.value = todayISO();
    categoryEl.value = CATEGORIES[0];

    updateStorageNote();

    if (!hasStorage) {
      loadMonth(state.year, state.month, function (entries) {
        state.entries = entries;
        render();
      });
      return;
    }

    window.conduit.storage.get("settings")
      .then(function (settings) {
        if (settings && typeof settings === "object") {
          if (typeof settings.currency === "string" && settings.currency) {
            state.currency = settings.currency;
          }
          if (typeof settings.budget === "number" && isFinite(settings.budget) && settings.budget > 0) {
            state.budget = settings.budget;
          }
        }
      })
      .catch(function () {
        // Keep defaults; settings will be written fresh on the next change.
      })
      .then(function () {
        loadMonth(state.year, state.month, function (entries) {
          state.entries = entries;
          var maxId = 0;
          entries.forEach(function (e) { if (typeof e.id === "number" && e.id > maxId) maxId = e.id; });
          state.nextId = maxId + 1;
          render();
        });
      });
  }

  init();
})();
</script>
