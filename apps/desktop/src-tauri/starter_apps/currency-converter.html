<meta name="conduit-network" content="https://api.frankfurter.dev — live currency exchange rates">
<style>
  html:not([data-theme]), html[data-theme="dark"] {
    --bg:#0b0d12; --surface:#11141b; --surface-hi:#161a23; --line:#1c2130; --line-hi:#262c3c;
    --ink:#e8eaf0; --ink-2:#b8becc; --ink-3:#8990a2; --accent:#ff7a59; --accent-ink:#1a0b06;
    --accent-soft: rgba(255,122,89,.14); --signal:#7cc4ff; --ok:#7cffb2; --warn:#febc2e; --err:#ff9c82;
    color-scheme: dark;
  }
  html[data-theme="light"] {
    --bg:#f6f6f8; --surface:#ffffff; --surface-hi:#f1f2f5; --line:#e1e3ea; --line-hi:#dadce3;
    --ink:#16181d; --ink-2:#3a3f4a; --ink-3:#5f6573; --accent:#4b4ded; --accent-ink:#ffffff;
    --accent-soft:#eef0ff; --signal:#1f86e8; --ok:#137a3a; --warn:#9a5300; --err:#b4380f;
    color-scheme: light;
  }

  html, body {
    background: var(--bg);
    margin: 0;
    padding: 0;
  }

  * { box-sizing: border-box; }

  [hidden] { display: none !important; }

  .cc-app {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink);
    max-width: 560px;
    min-width: 0;
    margin: 0 auto;
    padding: 28px 16px 40px;
  }

  .cc-header { margin-bottom: 18px; }

  .cc-title {
    font-size: 1.35rem;
    font-weight: 650;
    margin: 0 0 4px;
    letter-spacing: -.01em;
  }

  .cc-subtitle {
    margin: 0;
    color: var(--ink-3);
    font-size: .9rem;
  }

  .cc-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 22px;
  }

  .cc-field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; }
  .cc-field:last-of-type { margin-bottom: 0; }

  .cc-field label {
    font-size: .78rem;
    font-weight: 600;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: var(--ink-3);
  }

  input, select, button { font-family: inherit; }

  #cc-amount {
    font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
    font-variant-numeric: tabular-nums;
    font-size: 1.15rem;
    background: var(--surface-hi);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 11px 14px;
    color: var(--ink);
    width: 100%;
  }

  select {
    background: var(--surface-hi);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 11px 12px;
    color: var(--ink);
    width: 100%;
    font-size: .95rem;
  }

  input:focus-visible, select:focus-visible, button:focus-visible {
    outline: 2px solid var(--signal);
    outline-offset: 2px;
  }

  .cc-row {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 18px;
  }

  .cc-field-currency {
    flex: 1 1 160px;
    min-width: 140px;
    margin-bottom: 0;
  }

  .cc-swap-btn {
    flex: 0 0 auto;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 1px solid var(--line-hi);
    background: var(--surface-hi);
    color: var(--ink-2);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
    margin-bottom: 1px;
  }

  .cc-swap-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .cc-swap-btn svg { width: 20px; height: 20px; }

  .cc-status {
    display: flex;
    align-items: center;
    gap: 9px;
    color: var(--ink-2);
    font-size: .88rem;
    padding: 4px 0;
  }

  .cc-spinner {
    width: 15px;
    height: 15px;
    border-radius: 50%;
    border: 2px solid var(--line-hi);
    border-top-color: var(--accent);
    animation: cc-spin .8s linear infinite;
    flex: 0 0 auto;
  }

  @keyframes cc-spin { to { transform: rotate(360deg); } }

  .cc-error {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    background: var(--surface-hi);
    border: 1px solid var(--err);
    color: var(--err);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: .88rem;
    margin: 6px 0;
  }

  .cc-retry-btn {
    border: 1px solid var(--err);
    background: transparent;
    color: var(--err);
    border-radius: 8px;
    padding: 5px 12px;
    font-size: .82rem;
    font-weight: 600;
    cursor: pointer;
    flex: 0 0 auto;
  }

  .cc-retry-btn:hover {
    background: var(--err);
    color: var(--surface);
  }

  .cc-result-area { margin-top: 4px; }

  .cc-result-block {
    background: var(--surface-hi);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px 20px;
    text-align: center;
  }

  .cc-result {
    font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
    font-variant-numeric: tabular-nums;
    font-size: 1.7rem;
    font-weight: 650;
    color: var(--ink);
    word-break: break-word;
  }

  .cc-rate-line {
    font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
    font-variant-numeric: tabular-nums;
    color: var(--ink-2);
    font-size: .92rem;
    margin-top: 8px;
  }

  .cc-date-line {
    color: var(--ink-3);
    font-size: .8rem;
    margin-top: 4px;
  }

  @media (max-width: 380px) {
    .cc-title { font-size: 1.2rem; }
    .cc-card { padding: 16px; }
    .cc-result { font-size: 1.4rem; }
  }
</style>

<div class="cc-app">
  <header class="cc-header">
    <h1 class="cc-title" data-i18n="title">Currency Converter</h1>
    <p class="cc-subtitle" data-i18n="sub">Live exchange rates from Frankfurter</p>
  </header>

  <div class="cc-card">
    <div class="cc-field">
      <label for="cc-amount" data-i18n="amount">Amount</label>
      <input id="cc-amount" type="number" inputmode="decimal" min="0" step="any" value="1" />
    </div>

    <div class="cc-row">
      <div class="cc-field cc-field-currency">
        <label for="cc-from" data-i18n="from">From</label>
        <select id="cc-from"></select>
      </div>

      <button type="button" id="cc-swap" class="cc-swap-btn" aria-label="Swap from and to currencies" title="Swap currencies" data-i18n-aria="swapAria" data-i18n-title="swapTitle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M7 4v13" />
          <path d="M3 13l4 4 4-4" />
          <path d="M17 20V7" />
          <path d="M21 11l-4-4-4 4" />
        </svg>
      </button>

      <div class="cc-field cc-field-currency">
        <label for="cc-to" data-i18n="to">To</label>
        <select id="cc-to"></select>
      </div>
    </div>

    <div id="cc-currencies-loading" class="cc-status" hidden>
      <span class="cc-spinner" aria-hidden="true"></span>
      <span data-i18n="loadC">Loading currency list…</span>
    </div>
    <div id="cc-currencies-error" class="cc-error" role="alert" hidden>
      <span id="cc-currencies-error-text"></span>
      <button type="button" id="cc-currencies-retry" class="cc-retry-btn" data-i18n="retry">Retry</button>
    </div>

    <div class="cc-result-area" aria-live="polite">
      <div id="cc-rates-loading" class="cc-status" hidden>
        <span class="cc-spinner" aria-hidden="true"></span>
        <span data-i18n="loadR">Loading exchange rates…</span>
      </div>
      <div id="cc-rates-error" class="cc-error" role="alert" hidden>
        <span id="cc-rates-error-text"></span>
        <button type="button" id="cc-rates-retry" class="cc-retry-btn" data-i18n="retry">Retry</button>
      </div>
      <div id="cc-result-block" class="cc-result-block" hidden>
        <div class="cc-result" id="cc-result">—</div>
        <div class="cc-rate-line" id="cc-rate-line"></div>
        <div class="cc-date-line" id="cc-date-line"></div>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var LANG = (document.documentElement.getAttribute('lang') || navigator.language || 'en');
  var STRINGS = {
    en: {
      title: "Currency Converter", sub: "Live exchange rates from Frankfurter", amount: "Amount", from: "From", to: "To",
      swapAria: "Swap from and to currencies", swapTitle: "Swap currencies",
      loadC: "Loading currency list…", loadR: "Loading exchange rates…", retry: "Retry",
      eC: "Could not load the full currency list. Showing a short built-in list instead.",
      eR: "Could not load exchange rates. Check your connection or permission, then retry.",
      enter: "Enter an amount to convert", rate: "1 {from} = {rate} {to}", date: "Rates as of {date}"
    },
    de: {
      title: "Währungsrechner", sub: "Aktuelle Wechselkurse von Frankfurter", amount: "Betrag", from: "Von", to: "Nach",
      swapAria: "Ausgangs- und Zielwährung tauschen", swapTitle: "Währungen tauschen",
      loadC: "Währungsliste wird geladen…", loadR: "Wechselkurse werden geladen…", retry: "Erneut versuchen",
      eC: "Die vollständige Währungsliste konnte nicht geladen werden. Stattdessen wird eine kurze integrierte Liste angezeigt.",
      eR: "Die Wechselkurse konnten nicht geladen werden. Prüfe deine Verbindung oder die Berechtigung und versuche es erneut.",
      enter: "Gib einen Betrag zum Umrechnen ein", rate: "1 {from} = {rate} {to}", date: "Kurse vom {date}"
    },
    es: {
      title: "Conversor de divisas", sub: "Tipos de cambio en directo de Frankfurter", amount: "Importe", from: "De", to: "A",
      swapAria: "Intercambiar divisa de origen y de destino", swapTitle: "Intercambiar divisas",
      loadC: "Cargando la lista de divisas…", loadR: "Cargando los tipos de cambio…", retry: "Reintentar",
      eC: "No se pudo cargar la lista completa de divisas. Se muestra una lista breve integrada.",
      eR: "No se pudieron cargar los tipos de cambio. Comprueba tu conexión o el permiso y vuelve a intentarlo.",
      enter: "Introduce un importe para convertir", rate: "1 {from} = {rate} {to}", date: "Tipos de cambio a {date}"
    },
    fr: {
      title: "Convertisseur de devises", sub: "Taux de change en direct de Frankfurter", amount: "Montant", from: "De", to: "Vers",
      swapAria: "Inverser les devises de départ et d’arrivée", swapTitle: "Inverser les devises",
      loadC: "Chargement de la liste des devises…", loadR: "Chargement des taux de change…", retry: "Réessayer",
      eC: "Impossible de charger la liste complète des devises. Une courte liste intégrée est affichée à la place.",
      eR: "Impossible de charger les taux de change. Vérifiez votre connexion ou l’autorisation, puis réessayez.",
      enter: "Saisissez un montant à convertir", rate: "1 {from} = {rate} {to}", date: "Taux au {date}"
    },
    ja: {
      title: "通貨換算", sub: "Frankfurter のリアルタイム為替レート", amount: "金額", from: "換算元", to: "換算先",
      swapAria: "換算元と換算先の通貨を入れ替える", swapTitle: "通貨を入れ替え",
      loadC: "通貨リストを読み込み中…", loadR: "為替レートを読み込み中…", retry: "再試行",
      eC: "通貨リスト全体を読み込めませんでした。代わりに内蔵の短いリストを表示しています。",
      eR: "為替レートを読み込めませんでした。接続または権限を確認して、再試行してください。",
      enter: "換算する金額を入力してください", rate: "1 {from} = {rate} {to}", date: "{date}時点のレート"
    },
    ko: {
      title: "환율 계산기", sub: "Frankfurter의 실시간 환율", amount: "금액", from: "기준 통화", to: "변환 통화",
      swapAria: "기준 통화와 변환 통화 바꾸기", swapTitle: "통화 바꾸기",
      loadC: "통화 목록을 불러오는 중…", loadR: "환율을 불러오는 중…", retry: "다시 시도",
      eC: "전체 통화 목록을 불러올 수 없습니다. 대신 기본 제공 목록을 표시합니다.",
      eR: "환율을 불러올 수 없습니다. 연결 또는 권한을 확인한 후 다시 시도하세요.",
      enter: "변환할 금액을 입력하세요", rate: "1 {from} = {rate} {to}", date: "{date} 기준 환율"
    },
    "pt-BR": {
      title: "Conversor de moedas", sub: "Taxas de câmbio em tempo real do Frankfurter", amount: "Valor", from: "De", to: "Para",
      swapAria: "Inverter moedas de origem e de destino", swapTitle: "Inverter moedas",
      loadC: "Carregando a lista de moedas…", loadR: "Carregando as taxas de câmbio…", retry: "Tentar novamente",
      eC: "Não foi possível carregar a lista completa de moedas. Mostrando uma lista curta integrada.",
      eR: "Não foi possível carregar as taxas de câmbio. Verifique sua conexão ou permissão e tente novamente.",
      enter: "Digite um valor para converter", rate: "1 {from} = {rate} {to}", date: "Taxas de {date}"
    },
    "zh-CN": {
      title: "货币转换器", sub: "来自 Frankfurter 的实时汇率", amount: "金额", from: "从", to: "到",
      swapAria: "互换源货币和目标货币", swapTitle: "互换货币",
      loadC: "正在加载货币列表…", loadR: "正在加载汇率…", retry: "重试",
      eC: "无法加载完整的货币列表，已改为显示内置的简短列表。",
      eR: "无法加载汇率。请检查网络连接或权限后重试。",
      enter: "请输入要转换的金额", rate: "1 {from} = {rate} {to}", date: "汇率更新于 {date}"
    }
  };
  var L = STRINGS.hasOwnProperty(LANG) ? STRINGS[LANG] : (STRINGS.hasOwnProperty(LANG.split('-')[0]) ? STRINGS[LANG.split('-')[0]] : STRINGS.en);
  function t(key, vars) {
    var s = L.hasOwnProperty(key) ? L[key] : STRINGS.en[key];
    return s.replace(/\{(\w+)\}/g, function (m, k) { return vars && vars[k] !== undefined ? vars[k] : m; });
  }
  function applyI18n() {
    var attrs = { "data-i18n": "", "data-i18n-aria": "aria-label", "data-i18n-placeholder": "placeholder", "data-i18n-title": "title" };
    Object.keys(attrs).forEach(function (a) {
      Array.prototype.forEach.call(document.querySelectorAll("[" + a + "]"), function (el) {
        var v = t(el.getAttribute(a));
        if (attrs[a]) el.setAttribute(attrs[a], v); else el.textContent = v;
      });
    });
  }
  function nf(opts) {
    try { return new Intl.NumberFormat(LANG, opts); } catch (e) { return new Intl.NumberFormat("en", opts); }
  }
  var DN = null;
  try { DN = new Intl.DisplayNames([LANG], { type: "currency", fallback: "code" }); } catch (e) { DN = null; }
  function currencyName(code, fallback) {
    var n = "";
    try { n = DN ? DN.of(code) : ""; } catch (e) { n = ""; }
    return n && n !== code ? n : fallback;
  }
  function formatDate(iso) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso);
    if (!m) return iso;
    var d = new Date(+m[1], +m[2] - 1, +m[3]);
    try { return new Intl.DateTimeFormat(LANG, { dateStyle: "medium" }).format(d); }
    catch (e) { return new Intl.DateTimeFormat("en", { dateStyle: "medium" }).format(d); }
  }

  var FALLBACK_CURRENCIES = {
    USD: "US Dollar", EUR: "Euro", GBP: "British Pound", JPY: "Japanese Yen",
    AUD: "Australian Dollar", CAD: "Canadian Dollar", CHF: "Swiss Franc",
    CNY: "Chinese Yuan", INR: "Indian Rupee", BRL: "Brazilian Real",
    MXN: "Mexican Peso", ZAR: "South African Rand", SEK: "Swedish Krona",
    NOK: "Norwegian Krone", NZD: "New Zealand Dollar", SGD: "Singapore Dollar",
    HKD: "Hong Kong Dollar", KRW: "South Korean Won", PLN: "Polish Zloty",
    TRY: "Turkish Lira"
  };

  var state = {
    currencies: {},
    fromCode: "EUR",
    toCode: "USD",
    rates: null,
    ratesDate: "",
    currenciesLoading: false,
    ratesLoading: false,
    currenciesError: null,
    ratesError: null
  };

  var amountEl = document.getElementById("cc-amount");
  var fromEl = document.getElementById("cc-from");
  var toEl = document.getElementById("cc-to");
  var swapBtn = document.getElementById("cc-swap");

  var currenciesLoadingEl = document.getElementById("cc-currencies-loading");
  var currenciesErrorEl = document.getElementById("cc-currencies-error");
  var currenciesErrorTextEl = document.getElementById("cc-currencies-error-text");
  var currenciesRetryBtn = document.getElementById("cc-currencies-retry");

  var ratesLoadingEl = document.getElementById("cc-rates-loading");
  var ratesErrorEl = document.getElementById("cc-rates-error");
  var ratesErrorTextEl = document.getElementById("cc-rates-error-text");
  var ratesRetryBtn = document.getElementById("cc-rates-retry");

  var resultBlockEl = document.getElementById("cc-result-block");
  var resultEl = document.getElementById("cc-result");
  var rateLineEl = document.getElementById("cc-rate-line");
  var dateLineEl = document.getElementById("cc-date-line");

  function trimNumber(n) {
    if (!isFinite(n)) return String(n);
    return nf({ maximumSignificantDigits: 6 }).format(n);
  }

  function formatResult(n) {
    return nf({ minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(n);
  }

  function populateSelects(map) {
    var codes = Object.keys(map).sort();
    if (codes.length === 0) return;

    var prevFrom = state.fromCode;
    var prevTo = state.toCode;

    fromEl.innerHTML = "";
    toEl.innerHTML = "";

    codes.forEach(function (code) {
      var label = code + " — " + currencyName(code, map[code]);
      var opt1 = document.createElement("option");
      opt1.value = code;
      opt1.textContent = label;
      fromEl.appendChild(opt1);

      var opt2 = document.createElement("option");
      opt2.value = code;
      opt2.textContent = label;
      toEl.appendChild(opt2);
    });

    state.fromCode = codes.indexOf(prevFrom) !== -1 ? prevFrom : (codes.indexOf("EUR") !== -1 ? "EUR" : codes[0]);
    state.toCode = codes.indexOf(prevTo) !== -1 ? prevTo : (codes.indexOf("USD") !== -1 ? "USD" : codes[Math.min(1, codes.length - 1)]);

    fromEl.value = state.fromCode;
    toEl.value = state.toCode;
  }

  function render() {
    currenciesLoadingEl.hidden = !state.currenciesLoading;
    currenciesErrorEl.hidden = !state.currenciesError;
    if (state.currenciesError) currenciesErrorTextEl.textContent = state.currenciesError;

    ratesLoadingEl.hidden = !state.ratesLoading;
    ratesErrorEl.hidden = !state.ratesError;
    if (state.ratesError) ratesErrorTextEl.textContent = state.ratesError;

    var showResult = !state.ratesLoading && !state.ratesError && state.rates;
    resultBlockEl.hidden = !showResult;

    if (showResult) {
      var amount = parseFloat(amountEl.value);
      var rate = state.rates[state.toCode];

      if (!isFinite(amount) || amount < 0) {
        resultEl.textContent = t("enter");
      } else if (typeof rate !== "number") {
        resultEl.textContent = "—";
      } else {
        var converted = amount * rate;
        resultEl.textContent = formatResult(converted) + " " + state.toCode;
      }

      if (typeof rate === "number") {
        rateLineEl.textContent = t("rate", { from: state.fromCode, rate: trimNumber(rate), to: state.toCode });
        dateLineEl.textContent = state.ratesDate ? t("date", { date: formatDate(state.ratesDate) }) : "";
      } else {
        rateLineEl.textContent = "";
        dateLineEl.textContent = "";
      }
    }
  }

  function loadCurrencies() {
    state.currenciesLoading = true;
    state.currenciesError = null;
    render();

    fetch("https://api.frankfurter.dev/v1/currencies")
      .then(function (r) {
        if (!r.ok) throw new Error("Request failed (" + r.status + ")");
        return r.json();
      })
      .then(function (data) {
        state.currencies = data;
        populateSelects(state.currencies);
      })
      .catch(function () {
        state.currencies = FALLBACK_CURRENCIES;
        populateSelects(state.currencies);
        state.currenciesError = t("eC");
      })
      .then(function () {
        state.currenciesLoading = false;
        render();
      });
  }

  function loadRates(base) {
    state.ratesLoading = true;
    state.ratesError = null;
    render();

    fetch("https://api.frankfurter.dev/v1/latest?base=" + encodeURIComponent(base))
      .then(function (r) {
        if (!r.ok) throw new Error("Request failed (" + r.status + ")");
        return r.json();
      })
      .then(function (data) {
        var rates = data.rates || {};
        rates[data.base] = 1;
        state.rates = rates;
        state.ratesDate = data.date || "";
      })
      .catch(function () {
        state.rates = null;
        state.ratesDate = "";
        state.ratesError = t("eR");
      })
      .then(function () {
        state.ratesLoading = false;
        render();
      });
  }

  amountEl.addEventListener("input", render);

  fromEl.addEventListener("change", function () {
    state.fromCode = fromEl.value;
    loadRates(state.fromCode);
  });

  toEl.addEventListener("change", function () {
    state.toCode = toEl.value;
    render();
  });

  swapBtn.addEventListener("click", function () {
    var tmp = state.fromCode;
    state.fromCode = state.toCode;
    state.toCode = tmp;
    fromEl.value = state.fromCode;
    toEl.value = state.toCode;
    loadRates(state.fromCode);
  });

  currenciesRetryBtn.addEventListener("click", loadCurrencies);
  ratesRetryBtn.addEventListener("click", function () {
    loadRates(state.fromCode);
  });

  applyI18n();
  populateSelects(FALLBACK_CURRENCIES);
  loadCurrencies();
  loadRates(state.fromCode);
})();
</script>
