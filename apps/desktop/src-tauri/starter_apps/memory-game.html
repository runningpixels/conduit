<style>
  html[data-theme="dark"],
  html:not([data-theme]) {
    --bg:#0b0d12; --surface:#11141b; --surface-hi:#161a23; --line:#1c2130; --line-hi:#262c3c;
    --ink:#e8eaf0; --ink-2:#b8becc; --ink-3:#8990a2; --accent:#ff7a59; --accent-ink:#1a0b06;
    --accent-soft: rgba(255,122,89,.14); --signal:#7cc4ff; --ok:#7cffb2; --warn:#febc2e; --err:#ff9c82;
    color-scheme: dark;
  }

  html[data-theme="light"] {
    --bg:#f6f6f8; --surface:#ffffff; --surface-hi:#f1f2f5; --line:#e1e3ea; --line-hi:#dadce3;
    --ink:#16181d; --ink-2:#3a3f4a; --ink-3:#5f6573; --accent:#4b4ded; --accent-ink:#ffffff;
    --accent-soft:#eef0ff; --signal:#1f86e8; --ok:#137a3a; --warn:#9a5300; --err:#b4380f;
    color-scheme: light;
  }

  html, body {
    background: var(--bg);
    color: var(--ink);
    margin: 0;
    min-height: 100%;
  }

  *, *::before, *::after { box-sizing: border-box; }

  .mg-app {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    max-width: 640px;
    margin: 0 auto;
    padding: 28px 20px 40px;
  }

  .mg-header h1 {
    font-size: 1.4rem;
    font-weight: 650;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }

  .mg-header p {
    margin: 0 0 20px;
    color: var(--ink-3);
    font-size: 0.92rem;
  }

  .mg-controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }

  .mg-btn {
    max-width: 100%;
    font: inherit;
    font-weight: 600;
    font-size: 0.92rem;
    background: var(--accent);
    color: var(--accent-ink);
    border: none;
    border-radius: 10px;
    padding: 10px 18px;
    cursor: pointer;
  }

  .mg-btn:hover { filter: brightness(1.06); }
  .mg-btn:active { filter: brightness(0.96); }

  .mg-stats {
    display: flex;
    gap: 18px;
    font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
    font-variant-numeric: tabular-nums;
    font-size: 0.95rem;
    color: var(--ink-2);
  }

  .mg-stats .mg-stat-label {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink-3);
    margin-right: 4px;
  }

  .mg-status {
    min-height: 1.4em;
    margin: 2px 0 18px;
    font-size: 0.92rem;
    color: var(--ink-2);
  }

  .mg-status.mg-win {
    color: var(--ok);
    font-weight: 600;
  }

  .mg-board {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: clamp(8px, 2.5vw, 14px);
    width: min(100%, 560px);
    margin: 0 auto;
  }

  .mg-card {
    appearance: none;
    font: inherit;
    aspect-ratio: 1;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 12px;
    border: 1px solid var(--line-hi);
    background: var(--surface-hi);
    color: var(--ink);
    font-size: clamp(1.5rem, 6vw, 2.25rem);
    line-height: 1;
    cursor: pointer;
    padding: 0;
    transition: background-color 120ms ease, border-color 120ms ease;
    outline: none;
  }

  .mg-card:hover:not(.mg-matched):not(.mg-flipped) {
    border-color: var(--line);
    background: var(--surface);
  }

  .mg-card:focus-visible {
    outline: 2px solid var(--signal);
    outline-offset: 2px;
  }

  .mg-card.mg-flipped {
    background: var(--accent-soft);
    border-color: var(--accent);
  }

  .mg-card.mg-matched {
    background: var(--surface);
    border: 2px solid var(--ok);
    cursor: default;
  }

  @media (max-width: 380px) {
    .mg-app { padding: 20px 14px 32px; }
  }
</style>

<div class="mg-app">
  <div class="mg-header">
    <h1 data-i18n="title">Memory Match</h1>
    <p id="mg-subtitle">Find all 8 matching pairs in as few moves as possible.</p>
  </div>

  <div class="mg-controls">
    <button type="button" class="mg-btn" id="mg-new-game" data-i18n="newGame">New game</button>
    <div class="mg-stats">
      <span>
        <span class="mg-stat-label" data-i18n="moves">Moves</span><span id="mg-moves" aria-live="polite" aria-atomic="true">0</span>
      </span>
      <span>
        <span class="mg-stat-label" data-i18n="time">Time</span><span id="mg-timer">00:00</span>
      </span>
    </div>
  </div>

  <p class="mg-status" id="mg-status" aria-live="polite" aria-atomic="true"></p>

  <div class="mg-board" id="mg-board"></div>
</div>

<script>
(function () {
  var LANG = (document.documentElement.getAttribute('lang') || navigator.language || 'en');
  var STRINGS = {
    en: {
      title: "Memory Match",
      subtitle: "Find all {pairs} matching pairs in as few moves as possible.",
      newGame: "New game",
      moves: "Moves",
      time: "Time",
      match: "Match!",
      noMatch: "No match, try again.",
      win: "You won in {moves} moves and {time}.",
      cardShown: "Card {n}, {emoji}",
      cardHidden: "Card {n}, hidden"
    },
    de: {
      title: "Memory",
      subtitle: "Finde alle {pairs} passenden Paare mit möglichst wenigen Zügen.",
      newGame: "Neues Spiel",
      moves: "Züge",
      time: "Zeit",
      match: "Treffer!",
      noMatch: "Kein Treffer, versuch es noch einmal.",
      win: "Gewonnen! {moves} Züge in {time}.",
      cardShown: "Karte {n}, {emoji}",
      cardHidden: "Karte {n}, verdeckt"
    },
    es: {
      title: "Juego de memoria",
      subtitle: "Encuentra las {pairs} parejas con el menor número de movimientos posible.",
      newGame: "Nueva partida",
      moves: "Movimientos",
      time: "Tiempo",
      match: "¡Pareja!",
      noMatch: "No coinciden, inténtalo de nuevo.",
      win: "Has ganado en {moves} movimientos y {time}.",
      cardShown: "Carta {n}, {emoji}",
      cardHidden: "Carta {n}, boca abajo"
    },
    fr: {
      title: "Memory",
      subtitle: "Trouvez les {pairs} paires identiques en un minimum de coups.",
      newGame: "Nouvelle partie",
      moves: "Coups",
      time: "Temps",
      match: "Paire trouvée !",
      noMatch: "Pas de paire, essayez encore.",
      win: "Gagné en {moves} coups et {time}.",
      cardShown: "Carte {n}, {emoji}",
      cardHidden: "Carte {n}, face cachée"
    },
    ja: {
      title: "神経衰弱",
      subtitle: "できるだけ少ない手数で、{pairs}組のペアをすべて見つけましょう。",
      newGame: "新しいゲーム",
      moves: "手数",
      time: "時間",
      match: "ペア成立！",
      noMatch: "ペアではありません。もう一度どうぞ。",
      win: "{moves}手、{time}でクリアしました。",
      cardShown: "カード {n}、{emoji}",
      cardHidden: "カード {n}、裏向き"
    },
    ko: {
      title: "카드 짝 맞추기",
      subtitle: "가능한 한 적은 횟수로 {pairs}쌍을 모두 찾아보세요.",
      newGame: "새 게임",
      moves: "횟수",
      time: "시간",
      match: "짝이 맞았어요!",
      noMatch: "짝이 맞지 않아요. 다시 시도해 보세요.",
      win: "{moves}번, {time} 만에 성공했습니다.",
      cardShown: "카드 {n}, {emoji}",
      cardHidden: "카드 {n}, 뒷면"
    },
    "pt-BR": {
      title: "Jogo da memória",
      subtitle: "Encontre todos os {pairs} pares com o menor número de jogadas possível.",
      newGame: "Novo jogo",
      moves: "Jogadas",
      time: "Tempo",
      match: "Par encontrado!",
      noMatch: "Não combinam, tente de novo.",
      win: "Você venceu em {moves} jogadas e {time}.",
      cardShown: "Carta {n}, {emoji}",
      cardHidden: "Carta {n}, virada para baixo"
    },
    "zh-CN": {
      title: "记忆配对",
      subtitle: "用尽可能少的步数找出全部 {pairs} 对相同的牌。",
      newGame: "新游戏",
      moves: "步数",
      time: "时间",
      match: "配对成功！",
      noMatch: "不匹配，再试一次。",
      win: "你赢了！用了 {moves} 步，耗时 {time}。",
      cardShown: "第 {n} 张牌，{emoji}",
      cardHidden: "第 {n} 张牌，背面朝上"
    }
  };
  var LOC = (function () {
    var l = String(LANG);
    if (STRINGS[l]) return l;
    var b = l.split('-')[0].toLowerCase();
    if (STRINGS[b]) return b;
    for (var k in STRINGS) { if (k.split('-')[0] === b) return k; }
    return 'en';
  })();
  function t(key, vars) {
    var s = STRINGS[LOC][key];
    if (s == null) s = STRINGS.en[key];
    if (vars) {
      s = s.replace(/\{(\w+)\}/g, function (m, n) { return vars[n] != null ? vars[n] : m; });
    }
    return s;
  }
  function fmtInt(n) {
    try { return new Intl.NumberFormat(LANG).format(n); }
    catch (e) { return new Intl.NumberFormat('en').format(n); }
  }
  Array.prototype.forEach.call(document.querySelectorAll('[data-i18n]'), function (el) {
    el.textContent = t(el.getAttribute('data-i18n'));
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-i18n-aria]'), function (el) {
    el.setAttribute('aria-label', t(el.getAttribute('data-i18n-aria')));
  });
  
  var EMOJIS = ['🍎', '🍌', '🍇', '🍓', '🍒', '🍑', '🥝', '🍉'];
  document.getElementById('mg-subtitle').textContent = t('subtitle', { pairs: fmtInt(EMOJIS.length) });

  var boardEl = document.getElementById('mg-board');
  var movesEl = document.getElementById('mg-moves');
  var timerEl = document.getElementById('mg-timer');
  var statusEl = document.getElementById('mg-status');
  var newGameBtn = document.getElementById('mg-new-game');

  var deck = [];
  var buttons = [];
  var firstIndex = null;
  var secondIndex = null;
  var lock = false;
  var moves = 0;
  var matchesFound = 0;
  var gameStarted = false;
  var startTime = null;
  var timerInterval = null;
  var resolveTimeout = null;

  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = arr[i];
      arr[i] = arr[j];
      arr[j] = tmp;
    }
    return arr;
  }

  function buildDeck() {
    var pairs = EMOJIS.concat(EMOJIS);
    shuffle(pairs);
    return pairs.map(function (emoji) {
      return { emoji: emoji, flipped: false, matched: false };
    });
  }

  function formatTime(totalSeconds) {
    var m = Math.floor(totalSeconds / 60);
    var s = totalSeconds % 60;
    return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  }

  function setStatus(text, isWin) {
    statusEl.textContent = text;
    statusEl.classList.toggle('mg-win', !!isWin);
  }

  function updateCardUI(index) {
    var card = deck[index];
    var btn = buttons[index];
    var position = index + 1;

    if (card.matched) {
      btn.classList.add('mg-matched');
      btn.classList.remove('mg-flipped');
      btn.textContent = card.emoji;
      btn.setAttribute('aria-label', t('cardShown', { n: fmtInt(position), emoji: card.emoji }));
    } else if (card.flipped) {
      btn.classList.add('mg-flipped');
      btn.classList.remove('mg-matched');
      btn.textContent = card.emoji;
      btn.setAttribute('aria-label', t('cardShown', { n: fmtInt(position), emoji: card.emoji }));
    } else {
      btn.classList.remove('mg-flipped', 'mg-matched');
      btn.textContent = '';
      btn.setAttribute('aria-label', t('cardHidden', { n: fmtInt(position) }));
    }
  }

  function renderBoard() {
    boardEl.innerHTML = '';
    buttons = [];
    deck.forEach(function (card, index) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'mg-card';
      btn.addEventListener('click', function () {
        onCardClick(index);
      });
      boardEl.appendChild(btn);
      buttons.push(btn);
      updateCardUI(index);
    });
  }

  function startGameTimer() {
    gameStarted = true;
    startTime = Date.now();
    updateTimerDisplay();
    timerInterval = setInterval(updateTimerDisplay, 250);
  }

  function updateTimerDisplay() {
    var elapsed = Math.floor((Date.now() - startTime) / 1000);
    timerEl.textContent = formatTime(elapsed);
  }

  function finishGame() {
    if (timerInterval) {
      clearInterval(timerInterval);
      timerInterval = null;
    }
    var elapsed = Math.floor((Date.now() - startTime) / 1000);
    timerEl.textContent = formatTime(elapsed);
    setStatus(t('win', { moves: fmtInt(moves), time: formatTime(elapsed) }), true);
  }

  function onCardClick(index) {
    if (lock) return;
    var card = deck[index];
    if (card.matched || card.flipped) return;

    if (!gameStarted) startGameTimer();

    card.flipped = true;
    updateCardUI(index);

    if (firstIndex === null) {
      firstIndex = index;
      return;
    }

    secondIndex = index;
    moves++;
    movesEl.textContent = fmtInt(moves);
    lock = true;

    var a = deck[firstIndex];
    var b = deck[secondIndex];

    if (a.emoji === b.emoji) {
      a.matched = true;
      b.matched = true;
      updateCardUI(firstIndex);
      updateCardUI(secondIndex);
      matchesFound++;
      setStatus(t('match'));
      firstIndex = null;
      secondIndex = null;
      lock = false;

      if (matchesFound === EMOJIS.length) {
        finishGame();
      }
    } else {
      setStatus(t('noMatch'));
      var fIndex = firstIndex;
      var sIndex = secondIndex;
      resolveTimeout = setTimeout(function () {
        a.flipped = false;
        b.flipped = false;
        updateCardUI(fIndex);
        updateCardUI(sIndex);
        firstIndex = null;
        secondIndex = null;
        lock = false;
        resolveTimeout = null;
      }, 800);
    }
  }

  function newGame() {
    if (resolveTimeout) {
      clearTimeout(resolveTimeout);
      resolveTimeout = null;
    }
    if (timerInterval) {
      clearInterval(timerInterval);
      timerInterval = null;
    }

    deck = buildDeck();
    firstIndex = null;
    secondIndex = null;
    lock = false;
    moves = 0;
    matchesFound = 0;
    gameStarted = false;
    startTime = null;

    movesEl.textContent = fmtInt(0);
    timerEl.textContent = '00:00';
    setStatus('');

    renderBoard();
  }

  newGameBtn.addEventListener('click', newGame);

  newGame();
})();
</script>
