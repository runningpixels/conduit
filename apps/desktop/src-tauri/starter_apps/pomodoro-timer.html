<style>
  html[data-theme="dark"],
  html:not([data-theme]) {
    --bg:#0b0d12; --surface:#11141b; --surface-hi:#161a23; --line:#1c2130; --line-hi:#262c3c;
    --ink:#e8eaf0; --ink-2:#b8becc; --ink-3:#8990a2; --accent:#ff7a59; --accent-ink:#1a0b06;
    --accent-soft: rgba(255,122,89,.14); --signal:#7cc4ff; --ok:#7cffb2; --warn:#febc2e; --err:#ff9c82;
    color-scheme: dark;
  }
  html[data-theme="light"] {
    --bg:#f6f6f8; --surface:#ffffff; --surface-hi:#f1f2f5; --line:#e1e3ea; --line-hi:#dadce3;
    --ink:#16181d; --ink-2:#3a3f4a; --ink-3:#5f6573; --accent:#4b4ded; --accent-ink:#ffffff;
    --accent-soft:#eef0ff; --signal:#1f86e8; --ok:#137a3a; --warn:#9a5300; --err:#b4380f;
    color-scheme: light;
  }

  html, body {
    background: var(--bg);
    margin: 0;
    padding: 0;
    min-height: 100%;
  }

  * { box-sizing: border-box; }

  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
  }

  .pomodoro {
    width: 100%;
    max-width: 520px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 36px 28px 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
  }

  .phase-label {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--ink-2);
    padding: 6px 16px;
    border-radius: 999px;
    background: var(--surface-hi);
    border: 1px solid var(--line);
  }

  .phase-label[data-phase="focus"] {
    color: var(--accent);
    background: var(--accent-soft);
    border-color: var(--accent);
  }

  .ring-wrap {
    position: relative;
    width: 260px;
    height: 260px;
    max-width: 70vw;
    max-height: 70vw;
  }

  .ring-wrap svg {
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
  }

  .ring-track {
    fill: none;
    stroke: var(--line);
    stroke-width: 10;
  }

  .ring-progress {
    fill: none;
    stroke: var(--accent);
    stroke-width: 10;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.2s linear;
  }

  @media (prefers-reduced-motion: reduce) {
    .ring-progress { transition: none; }
  }

  .ring-center {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 6px;
  }

  .time-readout {
    font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
    font-variant-numeric: tabular-nums;
    font-size: 52px;
    font-weight: 600;
    color: var(--ink);
    line-height: 1;
  }

  .cycle-dots {
    display: flex;
    gap: 8px;
  }

  .cycle-dots span {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--line-hi);
    display: inline-block;
  }

  .cycle-dots span.filled {
    background: var(--accent);
  }

  .controls {
    display: flex;
    gap: 12px;
    width: 100%;
    justify-content: center;
    flex-wrap: wrap;
  }

  button {
    white-space: normal;
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    border-radius: 10px;
    padding: 12px 22px;
    border: 1px solid var(--line);
    background: var(--surface-hi);
    color: var(--ink);
    cursor: pointer;
    outline: none;
    min-width: 96px;
  }

  button:hover {
    border-color: var(--line-hi);
  }

  button:active {
    transform: translateY(1px);
  }

  button:focus-visible {
    outline: 2px solid var(--signal);
    outline-offset: 2px;
  }

  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
    min-width: 128px;
  }

  .stat {
    text-align: center;
    color: var(--ink-2);
    font-size: 14px;
  }

  .stat strong {
    font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
    font-size: 16px;
  }

  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }
</style>

<div class="pomodoro">
  <div class="phase-label" id="phaseLabel" data-phase="focus" aria-live="polite">Focus</div>

  <div class="ring-wrap">
    <svg viewBox="0 0 200 200" aria-hidden="true">
      <circle class="ring-track" cx="100" cy="100" r="90"></circle>
      <circle class="ring-progress" id="ringProgress" cx="100" cy="100" r="90"></circle>
    </svg>
    <div class="ring-center">
      <div class="time-readout" id="timeReadout">25:00</div>
      <div class="cycle-dots" id="cycleDots" aria-hidden="true">
        <span></span><span></span><span></span><span></span>
      </div>
    </div>
  </div>

  <div class="controls">
    <button type="button" class="primary" id="toggleBtn">Start</button>
    <button type="button" id="resetBtn" data-i18n="reset">Reset</button>
    <button type="button" id="skipBtn" data-i18n="skip">Skip</button>
  </div>

  <div class="stat">
    <span data-i18n="sessionsLabel">Focus sessions completed:</span> <strong id="sessionCount">0</strong>
  </div>

  <div class="visually-hidden" id="statusRegion" aria-live="polite"></div>
</div>

<script>
(function () {
  var DURATIONS = {
    focus: 25 * 60 * 1000,
    short: 5 * 60 * 1000,
    long: 15 * 60 * 1000
  };
  var LANG = (document.documentElement.getAttribute('lang') || navigator.language || 'en');
  var STRINGS = {
    en: {
      focus: 'Focus', shortBreak: 'Short Break', longBreak: 'Long Break',
      start: 'Start', pause: 'Pause', resume: 'Resume', reset: 'Reset', skip: 'Skip',
      sessionsLabel: 'Focus sessions completed:',
      started: '{phase} started.', paused: '{phase} paused.', running: '{phase} running.', wasReset: '{phase} reset.'
    },
    de: {
      focus: 'Fokus', shortBreak: 'Kurze Pause', longBreak: 'Lange Pause',
      start: 'Start', pause: 'Pausieren', resume: 'Fortsetzen', reset: 'Zurücksetzen', skip: 'Überspringen',
      sessionsLabel: 'Abgeschlossene Fokus-Sitzungen:',
      started: '{phase} gestartet.', paused: '{phase} pausiert.', running: '{phase} läuft.', wasReset: '{phase} zurückgesetzt.'
    },
    es: {
      focus: 'Concentración', shortBreak: 'Descanso corto', longBreak: 'Descanso largo',
      start: 'Iniciar', pause: 'Pausar', resume: 'Reanudar', reset: 'Restablecer', skip: 'Omitir',
      sessionsLabel: 'Sesiones de concentración completadas:',
      started: '{phase}: iniciado.', paused: '{phase}: en pausa.', running: '{phase}: en curso.', wasReset: '{phase}: restablecido.'
    },
    fr: {
      focus: 'Concentration', shortBreak: 'Pause courte', longBreak: 'Pause longue',
      start: 'Démarrer', pause: 'Pause', resume: 'Reprendre', reset: 'Réinitialiser', skip: 'Passer',
      sessionsLabel: 'Sessions de concentration terminées :',
      started: '{phase} : démarrée.', paused: '{phase} : en pause.', running: '{phase} : en cours.', wasReset: '{phase} : réinitialisée.'
    },
    ja: {
      focus: '集中', shortBreak: '短い休憩', longBreak: '長い休憩',
      start: '開始', pause: '一時停止', resume: '再開', reset: 'リセット', skip: 'スキップ',
      sessionsLabel: '完了した集中セッション:',
      started: '{phase}を開始しました。', paused: '{phase}を一時停止しました。', running: '{phase}を実行中です。', wasReset: '{phase}をリセットしました。'
    },
    ko: {
      focus: '집중', shortBreak: '짧은 휴식', longBreak: '긴 휴식',
      start: '시작', pause: '일시정지', resume: '계속', reset: '초기화', skip: '건너뛰기',
      sessionsLabel: '완료한 집중 세션:',
      started: '{phase} 시작됨.', paused: '{phase} 일시정지됨.', running: '{phase} 진행 중.', wasReset: '{phase} 초기화됨.'
    },
    "pt-BR": {
      focus: 'Foco', shortBreak: 'Pausa curta', longBreak: 'Pausa longa',
      start: 'Iniciar', pause: 'Pausar', resume: 'Retomar', reset: 'Redefinir', skip: 'Pular',
      sessionsLabel: 'Sessões de foco concluídas:',
      started: '{phase}: iniciado.', paused: '{phase}: pausado.', running: '{phase}: em andamento.', wasReset: '{phase}: redefinido.'
    },
    "zh-CN": {
      focus: '专注', shortBreak: '短休息', longBreak: '长休息',
      start: '开始', pause: '暂停', resume: '继续', reset: '重置', skip: '跳过',
      sessionsLabel: '已完成的专注时段:',
      started: '{phase}已开始。', paused: '{phase}已暂停。', running: '{phase}进行中。', wasReset: '{phase}已重置。'
    }
  };
  var LOC = (function () {
    var l = String(LANG);
    if (STRINGS[l]) return l;
    var b = l.split('-')[0].toLowerCase();
    if (STRINGS[b]) return b;
    for (var k in STRINGS) { if (k.split('-')[0] === b) return k; }
    return 'en';
  })();
  function t(key, vars) {
    var s = STRINGS[LOC][key];
    if (s == null) s = STRINGS.en[key];
    if (vars) {
      s = s.replace(/\{(\w+)\}/g, function (m, n) { return vars[n] != null ? vars[n] : m; });
    }
    return s;
  }
  function fmtInt(n) {
    try { return new Intl.NumberFormat(LANG).format(n); }
    catch (e) { return new Intl.NumberFormat('en').format(n); }
  }
  var LABELS = {
    focus: t('focus'),
    short: t('shortBreak'),
    long: t('longBreak')
  };
  Array.prototype.forEach.call(document.querySelectorAll('[data-i18n]'), function (el) {
    el.textContent = t(el.getAttribute('data-i18n'));
  });

  var RADIUS = 90;
  var CIRCUMFERENCE = 2 * Math.PI * RADIUS;

  var phase = 'focus';
  var remaining = DURATIONS.focus;
  var running = false;
  var endTime = null;
  var completedFocusCount = 0;
  var focusPhaseIndex = 0;

  var phaseLabelEl = document.getElementById('phaseLabel');
  var timeReadoutEl = document.getElementById('timeReadout');
  var ringProgressEl = document.getElementById('ringProgress');
  var toggleBtn = document.getElementById('toggleBtn');
  var resetBtn = document.getElementById('resetBtn');
  var skipBtn = document.getElementById('skipBtn');
  var sessionCountEl = document.getElementById('sessionCount');
  var cycleDotsEl = document.getElementById('cycleDots');
  var statusRegion = document.getElementById('statusRegion');

  ringProgressEl.setAttribute('stroke-dasharray', String(CIRCUMFERENCE));

  function formatTime(ms) {
    var totalSeconds = Math.max(0, Math.ceil(ms / 1000));
    var m = Math.floor(totalSeconds / 60);
    var s = totalSeconds % 60;
    return (m < 10 ? '0' + m : String(m)) + ':' + (s < 10 ? '0' + s : String(s));
  }

  function render() {
    var duration = DURATIONS[phase];
    var fraction = duration > 0 ? Math.min(1, Math.max(0, remaining / duration)) : 0;

    timeReadoutEl.textContent = formatTime(remaining);

    phaseLabelEl.textContent = LABELS[phase];
    phaseLabelEl.setAttribute('data-phase', phase);

    var offset = CIRCUMFERENCE * (1 - fraction);
    ringProgressEl.setAttribute('stroke-dashoffset', String(offset));

    sessionCountEl.textContent = fmtInt(completedFocusCount);

    if (running) {
      toggleBtn.textContent = t('pause');
    } else if (remaining < duration) {
      toggleBtn.textContent = t('resume');
    } else {
      toggleBtn.textContent = t('start');
    }

    var dots = cycleDotsEl.children;
    var filled = completedFocusCount % 4;
    if (filled === 0 && completedFocusCount > 0) {
      filled = 4;
    }
    for (var i = 0; i < dots.length; i++) {
      if (i < filled) {
        dots[i].classList.add('filled');
      } else {
        dots[i].classList.remove('filled');
      }
    }
  }

  function announce(message) {
    statusRegion.textContent = message;
  }

  function advancePhase(natural) {
    if (phase === 'focus') {
      if (natural) {
        completedFocusCount += 1;
      }
      focusPhaseIndex += 1;
      phase = (focusPhaseIndex % 4 === 0) ? 'long' : 'short';
    } else {
      phase = 'focus';
    }

    remaining = DURATIONS[phase];

    if (running) {
      endTime = Date.now() + remaining;
    } else {
      endTime = null;
    }

    announce(t('started', { phase: LABELS[phase] }));
    render();
  }

  function tick() {
    if (!running) {
      return;
    }
    var rem = endTime - Date.now();
    if (rem <= 0) {
      advancePhase(true);
    } else {
      remaining = rem;
      render();
    }
  }

  function toggleRunning() {
    if (running) {
      remaining = Math.max(0, endTime - Date.now());
      running = false;
      endTime = null;
      announce(t('paused', { phase: LABELS[phase] }));
    } else {
      if (remaining <= 0) {
        remaining = DURATIONS[phase];
      }
      endTime = Date.now() + remaining;
      running = true;
      announce(t('running', { phase: LABELS[phase] }));
    }
    render();
  }

  function reset() {
    running = false;
    endTime = null;
    remaining = DURATIONS[phase];
    announce(t('wasReset', { phase: LABELS[phase] }));
    render();
  }

  function skip() {
    advancePhase(false);
  }

  toggleBtn.addEventListener('click', toggleRunning);
  resetBtn.addEventListener('click', reset);
  skipBtn.addEventListener('click', skip);

  setInterval(tick, 200);

  render();
})();
</script>
