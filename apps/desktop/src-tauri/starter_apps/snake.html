<meta charset="utf-8">
<style>
  html[data-theme="dark"], html:not([data-theme]) {
    --bg:#0b0d12; --surface:#11141b; --surface-hi:#161a23; --line:#1c2130; --line-hi:#262c3c;
    --ink:#e8eaf0; --ink-2:#b8becc; --ink-3:#8990a2; --accent:#ff7a59; --accent-ink:#1a0b06;
    --accent-soft: rgba(255,122,89,.14); --signal:#7cc4ff; --ok:#7cffb2; --warn:#febc2e; --err:#ff9c82;
    color-scheme: dark;
  }
  html[data-theme="light"] {
    --bg:#f6f6f8; --surface:#ffffff; --surface-hi:#f1f2f5; --line:#e1e3ea; --line-hi:#dadce3;
    --ink:#16181d; --ink-2:#3a3f4a; --ink-3:#5f6573; --accent:#4b4ded; --accent-ink:#ffffff;
    --accent-soft:#eef0ff; --signal:#1f86e8; --ok:#137a3a; --warn:#9a5300; --err:#b4380f;
    color-scheme: light;
  }
  html, body {
    background: var(--bg);
    margin: 0;
    padding: 0;
  }
  * { box-sizing: border-box; }
  body {
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .snake-app {
    max-width: 1000px;
    margin: 0 auto;
    padding: 24px 16px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  .snake-header {
    width: 100%;
    max-width: 440px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }
  .snake-title {
    font-size: 18px;
    font-weight: 600;
    margin: 0;
    color: var(--ink);
  }
  .snake-scores {
    display: flex;
    gap: 16px;
  }
  .snake-score-box {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 8px 14px;
    text-align: center;
    min-width: 76px;
  }
  .snake-score-label {
    font-size: 11px;
    color: var(--ink-3);
    text-transform: uppercase;
    letter-spacing: .04em;
    margin: 0 0 2px;
  }
  .snake-score-value {
    font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
    font-variant-numeric: tabular-nums;
    font-size: 18px;
    font-weight: 600;
    color: var(--ink);
    margin: 0;
  }
  .snake-stage {
    position: relative;
    border-radius: 16px;
    background: var(--surface);
    border: 1px solid var(--line);
    padding: 12px;
    display: inline-block;
  }
  #snake-canvas {
    display: block;
    border-radius: 10px;
    background: var(--surface);
    outline: none;
    touch-action: none;
  }
  #snake-canvas:focus-visible {
    box-shadow: 0 0 0 3px var(--accent-soft), 0 0 0 1px var(--accent);
  }
  .snake-overlay {
    position: absolute;
    inset: 12px;
    border-radius: 10px;
    background: rgba(0,0,0,0.45);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    text-align: center;
    padding: 16px;
    pointer-events: none;
  }
  html[data-theme="light"] .snake-overlay {
    background: rgba(255,255,255,0.72);
  }
  .snake-overlay[hidden] { display: none; }
  .snake-overlay-title {
    font-size: 20px;
    font-weight: 700;
    color: var(--ink);
    margin: 0;
  }
  .snake-overlay-sub {
    font-size: 14px;
    color: var(--ink-2);
    margin: 0;
  }
  .snake-controls {
    width: 100%;
    max-width: 440px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .snake-btn {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 14px;
    font-weight: 600;
    color: var(--ink);
    background: var(--surface-hi);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 16px;
    cursor: pointer;
  }
  .snake-btn:hover {
    border-color: var(--line-hi);
  }
  .snake-btn:focus-visible {
    outline: none;
    box-shadow: 0 0 0 3px var(--accent-soft), 0 0 0 1px var(--accent);
  }
  .snake-btn.snake-primary {
    background: var(--accent);
    color: var(--accent-ink);
    border-color: var(--accent);
  }
  .snake-dpad {
    display: grid;
    grid-template-columns: repeat(3, 44px);
    grid-template-rows: repeat(3, 44px);
    gap: 4px;
  }
  .snake-dpad-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--surface-hi);
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--ink);
    cursor: pointer;
    padding: 0;
  }
  .snake-dpad-btn:hover {
    border-color: var(--line-hi);
  }
  .snake-dpad-btn:active {
    background: var(--accent-soft);
    border-color: var(--accent);
  }
  .snake-dpad-btn:focus-visible {
    outline: none;
    box-shadow: 0 0 0 3px var(--accent-soft), 0 0 0 1px var(--accent);
  }
  .snake-dpad-up { grid-column: 2; grid-row: 1; }
  .snake-dpad-left { grid-column: 1; grid-row: 2; }
  .snake-dpad-right { grid-column: 3; grid-row: 2; }
  .snake-dpad-down { grid-column: 2; grid-row: 3; }
  .snake-hint {
    font-size: 12px;
    color: var(--ink-3);
    text-align: center;
    max-width: 440px;
    margin: 0;
  }
  .snake-visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
    white-space: nowrap;
    border: 0;
  }
</style>

<div class="snake-app">
  <div class="snake-header">
    <h1 class="snake-title">Snake</h1>
    <div class="snake-scores">
      <div class="snake-score-box">
        <p class="snake-score-label">Score</p>
        <p class="snake-score-value" id="snake-score">0</p>
      </div>
      <div class="snake-score-box">
        <p class="snake-score-label">Best</p>
        <p class="snake-score-value" id="snake-best">0</p>
      </div>
    </div>
  </div>

  <div class="snake-stage">
    <canvas id="snake-canvas" tabindex="0" width="400" height="400" role="img" aria-label="Snake game board"></canvas>
    <div class="snake-overlay" id="snake-overlay-focus">
      <p class="snake-overlay-title">Click to play</p>
      <p class="snake-overlay-sub">Use Arrow keys or WASD</p>
    </div>
    <div class="snake-overlay" id="snake-overlay-pause" hidden>
      <p class="snake-overlay-title">Paused</p>
      <p class="snake-overlay-sub">Press Space or P to resume</p>
    </div>
    <div class="snake-overlay" id="snake-overlay-over" hidden>
      <p class="snake-overlay-title">Game Over</p>
      <p class="snake-overlay-sub" id="snake-overlay-final">Score: 0</p>
    </div>
  </div>

  <div class="snake-controls">
    <button type="button" class="snake-btn snake-primary" id="snake-restart">Restart</button>
    <div class="snake-dpad" role="group" aria-label="Direction controls">
      <button type="button" class="snake-dpad-btn snake-dpad-up" id="snake-btn-up" aria-label="Move up">&#9650;</button>
      <button type="button" class="snake-dpad-btn snake-dpad-left" id="snake-btn-left" aria-label="Move left">&#9664;</button>
      <button type="button" class="snake-dpad-btn snake-dpad-right" id="snake-btn-right" aria-label="Move right">&#9654;</button>
      <button type="button" class="snake-dpad-btn snake-dpad-down" id="snake-btn-down" aria-label="Move down">&#9660;</button>
    </div>
  </div>

  <p class="snake-hint">Arrow keys or WASD to move. Space or P to pause.</p>
  <div class="snake-visually-hidden" id="snake-status" aria-live="polite"></div>
</div>

<script>
(function () {
  var canvas = document.getElementById('snake-canvas');
  var ctx = canvas.getContext('2d');
  var scoreEl = document.getElementById('snake-score');
  var bestEl = document.getElementById('snake-best');
  var statusEl = document.getElementById('snake-status');
  var overlayFocus = document.getElementById('snake-overlay-focus');
  var overlayPause = document.getElementById('snake-overlay-pause');
  var overlayOver = document.getElementById('snake-overlay-over');
  var overlayFinal = document.getElementById('snake-overlay-final');
  var restartBtn = document.getElementById('snake-restart');

  var GRID = 20;
  var CELLS = 20; // 20x20 grid
  var BASE_INTERVAL = 140;
  var MIN_INTERVAL = 70;
  var SPEEDUP_EVERY = 3; // every N food items, speed up
  var SPEEDUP_STEP = 8;

  function getColors() {
    var theme = document.documentElement.getAttribute('data-theme');
    if (theme === 'light') {
      return {
        bg: '#ffffff',
        grid: '#e1e3ea',
        snake: '#4b4ded',
        head: '#137a3a',
        food: '#9a5300'
      };
    }
    return {
      bg: '#11141b',
      grid: '#1c2130',
      snake: '#ff7a59',
      head: '#7cffb2',
      food: '#febc2e'
    };
  }

  var hasFocus = false;
  var paused = false;
  var gameOver = false;
  var score = 0;
  var best = 0;
  var foodCount = 0;
  var tickInterval = BASE_INTERVAL;
  var lastTickTime = 0;
  var rafId = null;

  var snake, dir, nextDir, food;

  function resetGame() {
    var mid = Math.floor(CELLS / 2);
    snake = [
      { x: mid - 1, y: mid },
      { x: mid - 2, y: mid },
      { x: mid - 3, y: mid }
    ];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score = 0;
    foodCount = 0;
    tickInterval = BASE_INTERVAL;
    gameOver = false;
    paused = false;
    placeFood();
    updateScoreDisplay();
    overlayOver.hidden = true;
    overlayPause.hidden = true;
    announce('New game started. Score 0.');
  }

  function placeFood() {
    var attempts = 0;
    while (attempts < 500) {
      var fx = Math.floor(Math.random() * CELLS);
      var fy = Math.floor(Math.random() * CELLS);
      var collide = false;
      for (var i = 0; i < snake.length; i++) {
        if (snake[i].x === fx && snake[i].y === fy) { collide = true; break; }
      }
      if (!collide) {
        food = { x: fx, y: fy };
        return;
      }
      attempts++;
    }
    food = { x: 0, y: 0 };
  }

  function updateScoreDisplay() {
    scoreEl.textContent = String(score);
    bestEl.textContent = String(best);
  }

  function announce(msg) {
    statusEl.textContent = msg;
  }

  function setDirection(nx, ny) {
    if (gameOver) return;
    // Prevent reversing directly into itself
    if (nx === -dir.x && ny === -dir.y) return;
    nextDir = { x: nx, y: ny };
    if (paused && hasFocus) {
      // allow direction change while paused without unpausing
    }
  }

  function togglePause() {
    if (gameOver) return;
    paused = !paused;
    overlayPause.hidden = !paused;
    announce(paused ? 'Paused.' : 'Resumed.');
  }

  function step() {
    dir = nextDir;
    var head = snake[0];
    var newHead = { x: head.x + dir.x, y: head.y + dir.y };

    // Wall collision
    if (newHead.x < 0 || newHead.x >= CELLS || newHead.y < 0 || newHead.y >= CELLS) {
      endGame();
      return;
    }

    // Self collision (check against body, excluding tail which will move away
    // unless we just ate food and tail stays)
    for (var i = 0; i < snake.length; i++) {
      if (snake[i].x === newHead.x && snake[i].y === newHead.y) {
        endGame();
        return;
      }
    }

    snake.unshift(newHead);

    var ate = newHead.x === food.x && newHead.y === food.y;
    if (ate) {
      score += 1;
      foodCount += 1;
      if (score > best) {
        best = score;
      }
      updateScoreDisplay();
      announce('Score ' + score + '.');
      placeFood();
      if (foodCount % SPEEDUP_EVERY === 0) {
        tickInterval = Math.max(MIN_INTERVAL, tickInterval - SPEEDUP_STEP);
      }
    } else {
      snake.pop();
    }
  }

  function endGame() {
    gameOver = true;
    paused = false;
    overlayOver.hidden = false;
    overlayFinal.textContent = 'Score: ' + score;
    announce('Game over. Final score ' + score + '.');
  }

  function draw() {
    var colors = getColors();
    var w = canvas.width;
    var h = canvas.height;
    var cellSize = w / CELLS;

    ctx.fillStyle = colors.bg;
    ctx.fillRect(0, 0, w, h);

    // Grid lines (subtle)
    ctx.strokeStyle = colors.grid;
    ctx.lineWidth = 1;
    for (var i = 1; i < CELLS; i++) {
      var p = Math.round(i * cellSize) + 0.5;
      ctx.beginPath();
      ctx.moveTo(p, 0);
      ctx.lineTo(p, h);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, p);
      ctx.lineTo(w, p);
      ctx.stroke();
    }

    // Food
    var pad = cellSize * 0.18;
    ctx.fillStyle = colors.food;
    ctx.beginPath();
    ctx.arc(
      food.x * cellSize + cellSize / 2,
      food.y * cellSize + cellSize / 2,
      (cellSize - pad * 2) / 2,
      0,
      Math.PI * 2
    );
    ctx.fill();

    // Snake
    for (var s = 0; s < snake.length; s++) {
      var seg = snake[s];
      var isHead = s === 0;
      ctx.fillStyle = isHead ? colors.head : colors.snake;
      var margin = cellSize * 0.08;
      var rx = seg.x * cellSize + margin;
      var ry = seg.y * cellSize + margin;
      var rs = cellSize - margin * 2;
      var radius = 4;
      drawRoundedRect(rx, ry, rs, rs, radius);
      ctx.fill();
    }
  }

  function drawRoundedRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arcTo(x + w, y, x + w, y + r, r);
    ctx.lineTo(x + w, y + h - r);
    ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
    ctx.lineTo(x + r, y + h);
    ctx.arcTo(x, y + h, x, y + h - r, r);
    ctx.lineTo(x, y + r);
    ctx.arcTo(x, y, x + r, y, r);
    ctx.closePath();
  }

  function loop(timestamp) {
    rafId = requestAnimationFrame(loop);
    if (!hasFocus || paused || gameOver) {
      draw();
      return;
    }
    if (timestamp - lastTickTime >= tickInterval) {
      lastTickTime = timestamp;
      step();
    }
    draw();
  }

  function resizeCanvasForViewport() {
    var vw = window.innerWidth || 400;
    var size = 400;
    if (vw < 440) {
      size = Math.max(280, Math.min(360, vw - 48));
    }
    canvas.width = size;
    canvas.height = size;
  }

  // Keyboard handling
  window.addEventListener('keydown', function (e) {
    var key = e.key;
    var isArrow = key === 'ArrowUp' || key === 'ArrowDown' || key === 'ArrowLeft' || key === 'ArrowRight';
    var isWasd = key === 'w' || key === 'a' || key === 's' || key === 'd' || key === 'W' || key === 'A' || key === 'S' || key === 'D';
    var isSpace = key === ' ' || key === 'Spacebar';
    var isP = key === 'p' || key === 'P';

    if (!hasFocus) {
      return;
    }

    if (isArrow || isSpace) {
      e.preventDefault();
    }

    if (key === 'ArrowUp' || key === 'w' || key === 'W') setDirection(0, -1);
    else if (key === 'ArrowDown' || key === 's' || key === 'S') setDirection(0, 1);
    else if (key === 'ArrowLeft' || key === 'a' || key === 'A') setDirection(-1, 0);
    else if (key === 'ArrowRight' || key === 'd' || key === 'D') setDirection(1, 0);
    else if (isSpace || isP) togglePause();
  }, { passive: false });

  canvas.addEventListener('click', function () {
    canvas.focus();
  });

  canvas.addEventListener('focus', function () {
    hasFocus = true;
    overlayFocus.hidden = true;
  });

  canvas.addEventListener('blur', function () {
    hasFocus = false;
    overlayFocus.hidden = false;
  });

  restartBtn.addEventListener('click', function () {
    resetGame();
    canvas.focus();
  });

  function bindDpad(id, nx, ny) {
    var btn = document.getElementById(id);
    btn.addEventListener('click', function () {
      canvas.focus();
      setDirection(nx, ny);
    });
  }
  bindDpad('snake-btn-up', 0, -1);
  bindDpad('snake-btn-down', 0, 1);
  bindDpad('snake-btn-left', -1, 0);
  bindDpad('snake-btn-right', 1, 0);

  window.addEventListener('resize', resizeCanvasForViewport);

  resizeCanvasForViewport();
  resetGame();
  draw();
  rafId = requestAnimationFrame(loop);
})();
</script>
