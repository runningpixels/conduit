<meta name="conduit-network" content="https://api.open-meteo.com — fetch current weather and forecasts for the city you pick">
<meta name="conduit-network" content="https://geocoding-api.open-meteo.com — look up a city's coordinates for the search box">
<title>World weather</title>
<style>
:root{
  --bg:#0b1220; --panel:#131c2e; --panel2:#182238; --line:#25324b;
  --txt:#e8eefb; --dim:#93a3c0; --accent:#5aa9ff; --rain:#4f8dff;
}
*{box-sizing:border-box}
html{background:#0b1220}
body{
  margin:0; background:radial-gradient(1200px 600px at 20% -10%, #1b2a4a 0%, var(--bg) 55%) no-repeat fixed;
  color:var(--txt); font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding:22px 20px 44px;
}
.wrap{max-width:1080px;margin:0 auto}
header.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:12px;margin-bottom:4px}
.eyebrow{font-size:11.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);font-weight:700}
h1{font-size:22px;margin:0;letter-spacing:.2px}
.sub{color:var(--dim);font-size:13px}
.toolbar{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{
  background:var(--panel2); color:var(--txt); border:1px solid var(--line);
  padding:6px 11px; border-radius:9px; font:600 12.5px system-ui,sans-serif; cursor:pointer;
}
button:hover{border-color:var(--accent);color:#fff}
button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#06121f}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-top:16px}
.card h2{margin:0 0 12px;font-size:14px;text-transform:uppercase;letter-spacing:.09em;color:var(--dim)}

.curr{display:flex;flex-wrap:wrap;gap:26px;align-items:center}
.now-temp{font-size:64px;font-weight:700;line-height:1;letter-spacing:-2px}
.now-temp span{font-size:30px;vertical-align:top;color:var(--dim)}
.now-cond{display:flex;align-items:center;gap:12px}
.now-cond .emoji{font-size:44px;line-height:1}
.now-cond .label{font-size:16px;font-weight:600}
.now-cond .feels{font-size:13px;color:var(--dim)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:12px;flex:1 1 320px}
.fact{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:9px 11px}
.fact .k{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.fact .v{font-size:17px;font-weight:650;margin-top:3px}

.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
@media (max-width:900px){.days{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:560px){.days{grid-template-columns:repeat(2,minmax(0,1fr))}}
.day{background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:11px 10px;text-align:center}
.day.today{border-color:var(--accent);box-shadow:0 0 0 1px rgba(90,169,255,.35) inset}
.day .dn{font-size:12px;color:var(--dim);letter-spacing:.04em}
.day .ic{font-size:27px;margin:6px 0 2px}
.day .hi{font-size:19px;font-weight:700}
.day .lo{font-size:13px;color:var(--dim)}
.day .pc{font-size:11.5px;color:var(--rain);margin-top:6px;min-height:15px}
.day .ds{font-size:11px;color:var(--dim);margin-top:5px;line-height:1.3;min-height:29px}

.chart-head{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:6px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--dim);flex-wrap:wrap}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.chartbox{position:relative}
svg#chart{width:100%;height:auto;display:block;touch-action:none}
.tip{
  position:absolute;pointer-events:none;background:#0a1526f2;border:1px solid var(--accent);
  border-radius:10px;padding:8px 10px;font-size:12.5px;line-height:1.5;white-space:nowrap;
  transform:translate(-50%,-108%);opacity:0;transition:opacity .08s;z-index:4;box-shadow:0 8px 22px #0009}
.tip b{color:#fff}
.strip{display:flex;gap:9px;overflow-x:auto;padding:4px 2px 10px;scrollbar-color:var(--line) transparent}
.hr{flex:0 0 auto;width:78px;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:9px 6px;text-align:center}
.hr.now{border-color:var(--accent)}
.hr .t{font-size:11.5px;color:var(--dim)}
.hr .e{font-size:20px;margin:4px 0}
.hr .tt{font-size:15px;font-weight:650}
.hr .r{font-size:11px;color:var(--rain);margin-top:4px;min-height:14px}
.hr .a{font-size:10.5px;color:var(--dim);min-height:13px}
.wettest{font-size:12.5px;color:var(--dim);margin-top:8px}
.wettest b{color:var(--txt)}
.status{margin-top:14px;font-size:13px;color:var(--dim)}
.status.err{color:#ffb3b3}
.status .msg{background:#3a1520;border:1px solid #6d2333;border-radius:10px;padding:10px 12px;color:#ffd7d7;display:inline-block}
.muted{color:var(--dim);font-size:12.5px}

.search{position:relative}
.search input{
  background:var(--panel2);border:1px solid var(--line);color:var(--txt);
  padding:7px 11px;border-radius:9px;font:500 13px system-ui,sans-serif;width:216px;
}
.search input::placeholder{color:var(--dim)}
.search input:focus{outline:none;border-color:var(--accent)}
#results{
  position:absolute;top:calc(100% + 6px);right:0;width:320px;z-index:20;display:none;
  background:#0f1930;border:1px solid var(--line);border-radius:12px;padding:5px;
  box-shadow:0 14px 34px #000a;max-height:290px;overflow-y:auto;
}
#results.open{display:block}
.res{padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13px}
.res:hover,.res.active{background:var(--panel2)}
.res .nm{font-weight:600}
.res .rg{color:var(--dim);font-size:12px;margin-left:7px}
.res.none{color:var(--dim);cursor:default;font-size:12.5px;line-height:1.4}
.cities{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.chip{
  background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:4px 12px;
  font:600 12px system-ui,sans-serif;color:var(--dim);cursor:pointer;
}
.chip:hover{border-color:var(--accent);color:#fff}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#06121f}

footer{margin-top:22px;color:var(--dim);font-size:12px}
footer a{color:var(--accent)}
</style>
<div class="wrap">

  <header class="top">
    <div>
      <div class="eyebrow" data-i18n="title">World weather</div>
      <h1 id="place-name">New York</h1>
      <div class="sub" id="subline"></div>
    </div>
    <div class="toolbar">
      <div class="search">
        <input id="q" type="search" data-i18n-placeholder="searchPh" autocomplete="off"
               data-i18n-aria="searchAria" aria-expanded="false" role="combobox" />
        <div id="results" role="listbox" data-i18n-aria="resultsAria"></div>
      </div>
      <div class="toolbar" role="group" data-i18n-aria="unitsAria" style="margin-left:0">
        <button id="uF" type="button" aria-pressed="false" data-i18n-title="unitFTitle">°F</button>
        <button id="uC" type="button" aria-pressed="false" data-i18n-title="unitCTitle">°C</button>
      </div>
      <button id="reload" type="button" data-i18n="refresh">Refresh</button>
    </div>
  </header>
  <div class="cities" id="cities"></div>

  <section class="card" id="current-card">
    <h2 data-i18n="nowH">Right now</h2>
    <div class="curr" id="current">
      <div class="now-temp">--<span>°</span></div>
      <div class="now-cond"><div class="emoji">⏳</div><div><div class="label">…</div><div class="feels">—</div></div></div>
      <div class="facts"></div>
    </div>
    <div class="status" id="status"></div>
  </section>

  <section class="card">
    <h2 data-i18n="fcH">7-day forecast</h2>
    <div class="days" id="days"></div>
    <div class="muted" id="daily-note" style="margin-top:10px"></div>
  </section>

  <section class="card">
    <div class="chart-head">
      <h2 style="margin:0" data-i18n="chartH">Hour by hour, temperature and rain</h2>
      <div class="toolbar" style="margin-left:auto">
        <button type="button" data-span="24" aria-pressed="false"></button>
        <button type="button" data-span="48" aria-pressed="true"></button>
        <button type="button" data-span="72" aria-pressed="false"></button>
      </div>
    </div>
    <div class="legend">
      <span><i style="background:linear-gradient(#ff9f57,#ffd0a6)"></i><span id="leg-temp"></span></span>
      <span><i style="background:#4f8dff"></i><span data-i18n="legRain">Chance of rain (%)</span></span>
      <span><i style="background:#0b1220;border:1px solid #25324b"></i><span data-i18n="legNight">Shaded = night</span></span>
    </div>
    <div class="chartbox">
      <svg id="chart" viewBox="0 0 1000 400" preserveAspectRatio="xMidYMid meet" role="img" data-i18n-aria="chartAria"></svg>
      <div class="tip" id="tip"></div>
    </div>
    <div class="strip" id="strip"></div>
    <div class="wettest" id="wettest"></div>
  </section>

  <footer id="footer"></footer>
</div>

    ["ソウル", "韓国"], ["서울", "대한민국"], ["Seul", "Coreia do Sul"], ["首尔", "韩国"] ] },
  { id: "saopaulo", lang: "pt-BR", lat: -23.5475, lon: -46.6361, names: [
    ["São Paulo", "Brazil"], ["São Paulo", "Brasilien"], ["São Paulo", "Brasil"], ["São Paulo", "Brésil"],
    ["サンパウロ", "ブラジル"], ["상파울루", "브라질"], ["São Paulo", "Brasil"], ["圣保罗", "巴西"] ] },
  { id: "shanghai", lang: "zh-CN", lat: 31.2222, lon: 121.4581, names: [
    ["Shanghai", "China"], ["Shanghai", "China"], ["Shanghái", "China"], ["Shanghai", "Chine"],
    ["上海", "中国"], ["상하이", "중국"], ["Xangai", "China"], ["上海", "中国"] ] }
];
const PRESETS = CITIES.map(c => {
  const n = c.names[LANGS.indexOf(LANG)];
  return { name: n[0], admin: "", country: n[1], lat: c.lat, lon: c.lon };
});
// The city that matches the interface language opens first; anything else opens New York.
const HOME = (CITIES.findIndex(c => c.lang === LANG) >= 0) ? PRESETS[CITIES.findIndex(c => c.lang === LANG)] : PRESETS[0];

/* ---------- formatting ---------- */
const nfs = {};
function nf(n, d){
  if (!nfs[d]) nfs[d] = new Intl.NumberFormat(LANG, { minimumFractionDigits: d, maximumFractionDigits: d });
  return nfs[d].format(n);
}
const H12 = LANG === "en";
const hourFmt = new Intl.DateTimeFormat(LANG, H12 ? { hour: "numeric", hour12: true } : { hour: "numeric", hourCycle: "h23" });
const timeFmt = new Intl.DateTimeFormat(LANG, H12 ? { hour: "numeric", minute: "2-digit", hour12: true } : { hour: "2-digit", minute: "2-digit", hourCycle: "h23" });
const wdFmt = new Intl.DateTimeFormat(LANG, { weekday: "short" });
const mdFmt = new Intl.DateTimeFormat(LANG, { month: "numeric", day: "numeric" });
const dayFmt = new Intl.DateTimeFormat(LANG, { weekday: "short", month: "numeric", day: "numeric" });
// "2026-10-11" is a calendar day; "2026-10-11T15:00" is a wall-clock time in the city. Parse both as local so the numbers never shift.
const parse = s => {
  if (s.length === 10){ const p = s.split("-").map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  return new Date(s);
};
const hourOf = s => parse(s).getHours();
const hh = s => hourFmt.format(parse(s));

const state = { unit: LANG === "en" ? "F" : "C", span: 48, data: null, timer: null, place: HOME };

// The API always answers in metric (°C, km/h, mm); imperial is converted here.
const cvt = c => state.unit === "F" ? c * 9 / 5 + 32 : c;
const wspd = k => state.unit === "F" ? k * 0.621371 : k;
const wUnit = () => state.unit === "F" ? "mph" : "km/h";
const precip = (mm, d) => state.unit === "F" ? nf(mm / 25.4, d || 2) + " in" : nf(mm, 1) + " mm";
const WET_MM = 0.1;
const tempStr = c => c == null || isNaN(c) ? "--" : nf(Math.round(cvt(c)) + 0, 0) + "°";

const ICONS = {
  0:"☀️", 1:"🌤️", 2:"⛅", 3:"☁️", 45:"🌫️", 48:"🌫️", 51:"🌦️", 53:"🌦️", 55:"🌧️", 56:"🌧️", 57:"🌧️",
  61:"🌦️", 63:"🌧️", 65:"🌧️", 66:"🌧️", 67:"🌧️", 71:"🌨️", 73:"❄️", 75:"❄️", 77:"🌨️",
  80:"🌦️", 81:"🌧️", 82:"⛈️", 85:"🌨️", 86:"❄️", 95:"⛈️", 96:"⛈️", 99:"⛈️"
};
const cond = c => Object.prototype.hasOwnProperty.call(ICONS, c) ? [t("w" + c), ICONS[c]] : [t("unk"), "•"];

// Eight compass points, N first, clockwise.
const DIRS = {
  "en": ["N","NE","E","SE","S","SW","W","NW"], "de": ["N","NO","O","SO","S","SW","W","NW"],
  "es": ["N","NE","E","SE","S","SO","O","NO"], "fr": ["N","NE","E","SE","S","SO","O","NO"],
  "ja": ["北","北東","東","南東","南","南西","西","北西"], "ko": ["북","북동","동","남동","남","남서","서","북서"],
  "pt-BR": ["N","NE","L","SE","S","SO","O","NO"], "zh-CN": ["北","东北","东","东南","南","西南","西","西北"]
};

/* ---------- static text ---------- */
function applyStatic(){
  const attrs = { "data-i18n": "", "data-i18n-aria": "aria-label", "data-i18n-placeholder": "placeholder", "data-i18n-title": "title" };
  Object.keys(attrs).forEach(a => {
    document.querySelectorAll("[" + a + "]").forEach(el => {
      const v = t(el.getAttribute(a));
      if (attrs[a]) el.setAttribute(attrs[a], v); else el.textContent = v;
    });
  });
  document.querySelectorAll("[data-span]").forEach(b => { b.textContent = t("hoursBtn", { n: b.dataset.span }); });
  document.title = t("title");
  document.getElementById("leg-temp").textContent = t("legTemp", { u: "°" + state.unit });
}

function setStatus(msg, isErr){
  const el = document.getElementById("status");
  if (!msg){ el.textContent = ""; el.className = "status"; return; }
  el.className = "status" + (isErr ? " err" : "");
  if (isErr) el.innerHTML = '<div class="msg">' + msg + '</div>'; else el.textContent = msg;
}

async function load(){
  setStatus("");
  const P = state.place;
  const url = API + "?latitude=" + P.lat + "&longitude=" + P.lon +
    "&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m,wind_direction_10m,surface_pressure,cloud_cover" +
    "&hourly=temperature_2m,apparent_temperature,precipitation_probability,precipitation,weather_code,wind_speed_10m,is_day" +
    "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max" +
    "&timezone=auto&forecast_days=7";
  try{
    const r = await fetch(url);
    if (!r.ok) throw new Error(t("errHttp", { code: r.status }));
    const j = await r.json();
    if (!j || !j.current || !j.hourly || !j.daily) throw new Error(t("errBad"));
    if (P !== state.place) return; // the user picked another city while this was loading
    state.data = j;
    renderAll();
    setStatus(t("updated", { time: timeFmt.format(new Date()), place: placeLabel(P) }));
  }catch(e){
    if (P !== state.place) return;
    setStatus(t("errMain", {
      why: esc(e && e.message ? e.message : t("errNet")),
      refresh: esc(t("refresh")),
      place: esc(placeLabel(P)),
      link: '<a href="https://open-meteo.com/" target="_blank" rel="noopener">open-meteo.com</a>'
    }), true);
  }
}

function idxNow(){
  const d = state.data, k = d.current.time.slice(0,13);
  const i = d.hourly.time.findIndex(x => x.slice(0,13) >= k);
  return i < 0 ? 0 : i;
}

function renderAll(){ renderCurrent(); renderDays(); renderChart(); renderStrip(); }

function renderCurrent(){
  const d = state.data, c = d.current, cd = cond(c.weather_code), label = cd[0], emoji = cd[1];
  const dirs = DIRS[LANG];
  const dir = dirs[Math.round((c.wind_direction_10m || 0) / 45) % 8];
  document.getElementById("subline").textContent = t("sub", {
    lat: nf(d.latitude, 3) + "°", lon: nf(d.longitude, 3) + "°", elev: nf(d.elevation, 0),
    tz: d.timezone_abbreviation || d.timezone || "local"
  });
  document.querySelector(".now-temp").innerHTML = tempStr(c.temperature_2m) + "<span>" + state.unit + "</span>";
  const q = document.querySelector(".now-cond");
  q.querySelector(".emoji").textContent = emoji;
  q.querySelector(".label").textContent = label;
  q.querySelector(".feels").textContent = t("feels", { t: tempStr(c.apparent_temperature) });

  const today = d.daily, dayIdx = Math.max(0, today.time.findIndex(x => x === c.time.slice(0,10)));
  const facts = [
    [t("fHum"), c.relative_humidity_2m + "%"],
    [t("fWind"), nf(Math.round(wspd(c.wind_speed_10m)), 0) + " " + wUnit() + " " + dir],
    [t("fRain"), c.precipitation > 0 ? precip(c.precipitation) : t("none")],
    [t("fCloud"), c.cloud_cover + "%"],
    [t("fPress"), nf(Math.round(c.surface_pressure), 0) + " hPa"],
    [t("fToday"), t("todayFact", { hi: tempStr(today.temperature_2m_max[dayIdx]), lo: tempStr(today.temperature_2m_min[dayIdx]), p: today.precipitation_probability_max[dayIdx] })]
  ];
  document.querySelector(".facts").innerHTML =
    facts.map(f => '<div class="fact"><div class="k">' + esc(f[0]) + '</div><div class="v">' + esc(f[1]) + '</div></div>').join("");
}

function renderDays(){
  const d = state.data.daily, wrap = document.getElementById("days");
  const todayStr = state.data.current.time.slice(0,10);
  let wet = 0, rainTotal = 0;
  const parts = [];
  wrap.innerHTML = d.time.map((s, i) => {
    const dt = parse(s), cd = cond(d.weather_code[i]), label = cd[0], emoji = cd[1];
    const p = d.precipitation_probability_max[i] ?? 0, amt = d.precipitation_sum[i] || 0;
    if (p >= 30){ wet++; parts.push(wdFmt.format(dt) + " " + p + "%"); }
    rainTotal += amt;
    return '<div class="day' + (s === todayStr ? " today" : "") + '">' +
      '<div class="dn">' + esc(s === todayStr ? t("today") + " " + mdFmt.format(dt) : dayFmt.format(dt)) + '</div>' +
      '<div class="ic" title="' + esc(label) + '">' + emoji + '</div>' +
      '<div class="hi">' + tempStr(d.temperature_2m_max[i]) + '</div>' +
      '<div class="lo">' + tempStr(d.temperature_2m_min[i]) + '</div>' +
      '<div class="pc">' + (p >= 20 ? esc(t("dayRain", { p: p })) : "") + '</div>' +
      '<div class="ds">' + esc(label) + (amt > WET_MM ? '<br>' + esc(precip(amt)) : "") + '</div>' +
      '</div>';
  }).join("");
  document.getElementById("daily-note").textContent =
    wet === 0 ? t("dryWeek", { amt: precip(rainTotal) })
              : t(wet === 1 ? "wet1" : "wetN", { n: wet, list: parts.join(", "), amt: precip(rainTotal) });
}

function renderStrip(){
  const d = state.data, s = idxNow(), n = 24;
  const out = [];
  for (let k = 0; k < n && s + k < d.hourly.time.length; k++){
    const i = s + k, cd = cond(d.hourly.weather_code[i]);
    const p = d.hourly.precipitation_probability[i] ?? 0, amt = d.hourly.precipitation[i] ?? 0;
    out.push('<div class="hr' + (k === 0 ? " now" : "") + '">' +
      '<div class="t">' + esc(k === 0 ? t("nowLbl") : hh(d.hourly.time[i])) + '</div>' +
      '<div class="e" title="' + esc(cd[0]) + '">' + cd[1] + '</div>' +
      '<div class="tt">' + tempStr(d.hourly.temperature_2m[i]) + '</div>' +
      '<div class="r">' + (p >= 15 ? p + "%" : "") + '</div>' +
      '<div class="a">' + (amt > WET_MM ? esc(precip(amt)) : "") + '</div>' +
      '</div>');
  }
  document.getElementById("strip").innerHTML = out.join("");
}

/* ---------- chart ---------- */
function renderChart(){
  const svg = document.getElementById("chart");
  const SVGNS = "http://www.w3.org/2000/svg";
  svg.innerHTML = "";
  const d = state.data, start = idxNow(), span = state.span;
  const end = Math.min(start + span, d.hourly.time.length);
  const rows = [];
  for (let i = start; i < end; i++) rows.push({
    i: i,
    time: d.hourly.time[i],
    h: hourOf(d.hourly.time[i]),
    temp: cvt(d.hourly.temperature_2m[i]),
    prob: d.hourly.precipitation_probability[i] ?? 0,
    amt: d.hourly.precipitation[i] ?? 0,
    night: d.hourly.is_day[i] === 0
  });
  if (!rows.length) return;

  const W = 1000, HT = 400, pL = 56, pR = 60, pT = 30, pB = 52;
  const x0 = pL, x1 = W - pR, y0 = pT, y1 = HT - pB;
  const n = rows.length, step = (x1 - x0) / n;
  const X = k => x0 + step * k + step / 2;

  const temps = rows.map(r => r.temp);
  let tMin = Math.min.apply(null, temps), tMax = Math.max.apply(null, temps);
  const pad = Math.max(4, (tMax - tMin) * 0.18);
  tMin = Math.floor((tMin - pad) / 5) * 5; tMax = Math.ceil((tMax + pad) / 5) * 5;
  const YT = v => y1 - (v - tMin) / (tMax - tMin) * (y1 - y0);
  const YP = p => y1 - Math.max(0, Math.min(100, p)) / 100 * (y1 - y0);

  const el = (tag, attrs, text) => {
    const e = document.createElementNS(SVGNS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text != null) e.textContent = text;
    svg.appendChild(e); return e;
  };
  const defs = document.createElementNS(SVGNS, "defs");
  defs.innerHTML =
    '<linearGradient id="tfill" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0%" stop-color="#ff9f57" stop-opacity=".38"/>' +
      '<stop offset="100%" stop-color="#ff9f57" stop-opacity="0"/></linearGradient>' +
    '<linearGradient id="rbar" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0%" stop-color="#4f8dff" stop-opacity=".85"/>' +
      '<stop offset="100%" stop-color="#2a5fd0" stop-opacity=".45"/></linearGradient>';
  svg.appendChild(defs);

  el("rect", { x: x0, y: y0, width: x1 - x0, height: y1 - y0, fill: "#0d1626", stroke: "#25324b", rx: 8 });

  // night shading
  let s = null;
  rows.forEach((r, k) => {
    if (r.night && s === null) s = k;
    const last = k === n - 1;
    if (s !== null && (!r.night || last)){
      const e = r.night && last ? k : k - 1;
      el("rect", { x: X(s) - step/2, y: y0, width: Math.max(1, (e - s + 1) * step), height: y1 - y0, fill: "#050a14", opacity: "0.45" });
      s = null;
    }
  });

  // temperature gridlines (left axis); the range limits are in the chosen unit
  const range = tMax - tMin, scale = state.unit === "F" ? 1 : 0.56;
  const tStep = range > 40 * scale ? 10 : range > 18 * scale ? 5 : 2;
  for (let v = Math.ceil(tMin / tStep) * tStep; v <= tMax; v += tStep){
    const y = YT(v);
    el("line", { x1: x0, y1: y, x2: x1, y2: y, stroke: "#25324b", "stroke-width": "1", "stroke-dasharray": "3 5" });
    el("text", { x: x0 - 9, y: y + 4, fill: "#93a3c0", "font-size": "12", "text-anchor": "end" }, nf(Math.round(v) + 0, 0) + "°");
  }
  // rain axis (right side)
  [0, 25, 50, 75, 100].forEach(p => {
    el("text", { x: x1 + 9, y: YP(p) + 4, fill: "#6f9bff", "font-size": "12", "text-anchor": "start" }, p + "%");
  });
  el("text", { x: x1 + 9, y: y0 - 12, fill: "#6f9bff", "font-size": "11", "text-anchor": "start" }, t("rainAx"));

  // rain bars
  rows.forEach((r, k) => {
    const y = YP(r.prob);
    el("rect", { x: X(k) - Math.max(1.6, step * 0.32), y: y, width: Math.max(3.2, step * 0.64), height: Math.max(0, y1 - y), fill: "url(#rbar)", rx: Math.min(3, step * 0.3) });
    if (r.amt > WET_MM){ // actual rain amount marker (r.amt is in mm)
      const ah = Math.min(16, 4 + r.amt);
      el("rect", { x: X(k) - Math.max(1, step * 0.14), y: y1 - ah, width: Math.max(2, step * 0.28), height: ah, fill: "#9ed0ff", opacity: ".9", rx: 2 });
    }
  });

  // temperature line + fill
  const line = rows.map((r, k) => (k ? "L" : "M") + X(k).toFixed(1) + " " + YT(r.temp).toFixed(1)).join(" ");
  el("path", { d: line + " L " + X(n-1).toFixed(1) + " " + y1 + " L " + X(0).toFixed(1) + " " + y1 + " Z", fill: "url(#tfill)", stroke: "none" });
  el("path", { d: line, fill: "none", stroke: "#ff9f57", "stroke-width": "2.6", "stroke-linejoin": "round", "stroke-linecap": "round" });

  // day boundary + time labels
  const labelEvery = span === 24 ? 3 : 6;
  rows.forEach((r, k) => {
    if (r.h === 0 && k > 0){
      el("line", { x1: X(k) - step/2, y1: y0, x2: X(k) - step/2, y2: y1, stroke: "#4a5f85", "stroke-width": "1", "stroke-dasharray": "5 4" });
      el("text", { x: X(k) - step/2 + 5, y: y0 + 15, fill: "#c8d6ef", "font-size": "12", "font-weight": "600" }, wdFmt.format(parse(r.time)));
    }
    if (k === 0 || r.h % labelEvery === 0){
      el("text", { x: X(k), y: y1 + 20, fill: "#93a3c0", "font-size": "11.5", "text-anchor": "middle" },
         k === 0 ? t("nowLbl") : hh(r.time));
    }
  });

  // now marker + temp readout
  el("line", { x1: X(0), y1: y0, x2: X(0), y2: y1, stroke: "#5aa9ff", "stroke-width": "1.6" });
  const hi = rows.reduce((a, b) => b.temp > a.temp ? b : a, rows[0]);
  const lo = rows.reduce((a, b) => b.temp < a.temp ? b : a, rows[0]);
  el("circle", { cx: X(rows.indexOf(hi)), cy: YT(hi.temp), r: 4, fill: "#ffd0a6", stroke: "#ff9f57", "stroke-width": "2" });
  el("circle", { cx: X(rows.indexOf(lo)), cy: YT(lo.temp), r: 4, fill: "#9ec9ff", stroke: "#4f8dff", "stroke-width": "2" });
  el("text", { x: X(rows.indexOf(hi)), y: YT(hi.temp) - 11, fill: "#ffd0a6", "font-size": "12", "font-weight": "700", "text-anchor": "middle" }, nf(Math.round(hi.temp) + 0, 0) + "°");
  el("text", { x: X(rows.indexOf(lo)), y: YT(lo.temp) + 18, fill: "#9ec9ff", "font-size": "12", "font-weight": "700", "text-anchor": "middle" }, nf(Math.round(lo.temp) + 0, 0) + "°");

  // summary
  const maxProb = Math.max.apply(null, rows.map(r => r.prob));
  const totalAmt = rows.reduce((a, r) => a + r.amt, 0);
  const wetHours = rows.filter(r => r.prob >= 40 || r.amt > WET_MM).length;
  let when = "";
  if (maxProb >= 20){
    const peak = rows.reduce((a, b) => b.prob > a.prob ? b : a, rows[0]);
    when = t("peakWhen", { time: hh(peak.time), day: wdFmt.format(parse(peak.time)) });
  }
  document.getElementById("wettest").innerHTML = t("peakSum", {
    span: span, p: maxProb, amt: esc(precip(totalAmt)),
    hrs: esc(wetHours === 1 ? t("hr1") : t("hrN", { n: wetHours }))
  }) + esc(when);
}

/* ---------- hover tooltip ---------- */
(function(){
  const svg = document.getElementById("chart"), tip = document.getElementById("tip");
  function move(ev){
    if (!state.data) return;
    const rows = state.data.hourly.time.length;
    const start = idxNow(), end = Math.min(start + state.span, rows);
    const n = end - start; if (n <= 0) return;
    const rect = svg.getBoundingClientRect();
    const px = ev.touches ? ev.touches[0].clientX : ev.clientX;
    const rel = ((px - rect.left) / rect.width) * 1000;
    const x0 = 56, x1 = 1000 - 60, step = (x1 - x0) / n;
    let k = Math.round((rel - x0 - step/2) / step);
    k = Math.max(0, Math.min(n - 1, k));
    const i = start + k, H = state.data.hourly;
    const cd = cond(H.weather_code[i]);
    const amt = H.precipitation[i] || 0;
    tip.innerHTML = "<b>" + esc(k === 0 ? t("nowLbl") : hh(H.time[i])) + "</b> · " + esc(wdFmt.format(parse(H.time[i]))) + "<br>" +
      cd[1] + " " + esc(cd[0]) + "<br>" +
      t("tipTemp", { t: esc(tempStr(H.temperature_2m[i]) + state.unit), f: esc(tempStr(H.apparent_temperature[i])) }) + "<br>" +
      t("tipRain", { p: H.precipitation_probability[i] ?? 0 }) +
      (amt > WET_MM ? " · " + esc(precip(amt, 3)) : "") + "<br>" +
      t("tipWind", { w: esc(nf(Math.round(wspd(H.wind_speed_10m[i])), 0) + " " + wUnit()) });
    tip.style.opacity = "1";
    const boxEl = svg.parentElement || tip.parentElement;
    const box = boxEl ? boxEl.getBoundingClientRect() : { left: 0, top: 0 };
    tip.style.left = (rect.left - box.left + (x0 + step*k + step/2) / 1000 * rect.width) + "px";
    tip.style.top = (rect.top - box.top + 46) + "px";
  }
  const hide = () => { tip.style.opacity = "0"; };
  svg.addEventListener("mousemove", move);
  svg.addEventListener("mouseleave", hide);
  svg.addEventListener("touchstart", move, { passive: true });
  svg.addEventListener("touchmove", move, { passive: true });
  svg.addEventListener("touchend", hide);
})();

const fullLabel = p => placeLabel(p) + (p.country ? ", " + p.country : "");

    c.setAttribute("aria-pressed", c.dataset.key === keyOf(p)));
}

function renderChips(){
  document.getElementById("cities").innerHTML = PRESETS.map(p =>
    '<button class="chip" type="button" data-key="' + keyOf(p) + '" title="' + esc(fullLabel(p)) + '">' +
    esc(p.name) + '</button>').join("");
  document.querySelectorAll("#cities .chip").forEach(b => b.onclick = () => {
    const p = PRESETS.find(x => keyOf(x) === b.dataset.key);
    if (p) choose(p);
  });
}

function choose(src){
  state.place = {
    name: src.name || "?",
    admin: src.admin || "",
    country: src.country || "",
    lat: Number(src.lat), lon: Number(src.lon)
  };
  state.data = null;
  closeResults();
  qEl.value = "";
  updatePlaceLabels();
  document.getElementById("subline").textContent = t("subLoad", { lat: coord(state.place.lat), lon: coord(state.place.lon) });
  document.querySelector(".now-temp").innerHTML = "--<span>" + state.unit + "</span>";
  document.querySelector(".now-cond .emoji").textContent = "⏳";
  document.querySelector(".now-cond .label").textContent = t("loading");
  document.querySelector(".now-cond .feels").textContent = "—";
  document.querySelector(".facts").innerHTML = "";
  document.getElementById("days").innerHTML = "";
  document.getElementById("daily-note").textContent = "";
  document.getElementById("chart").innerHTML = "";
  document.getElementById("strip").innerHTML = "";
  document.getElementById("wettest").textContent = "";
  setStatus(t("loadingPlace", { place: placeLabel(state.place) }));
  load();
}

function openResults(html){
  resBox.innerHTML = html;
  resBox.classList.add("open");
  qEl.setAttribute("aria-expanded", "true");
}
function closeResults(){
  resBox.classList.remove("open");
  resBox.innerHTML = "";
  qEl.setAttribute("aria-expanded", "false");
}

let searchSeq = 0, searchTimer = null;
async function runSearch(term){
  const seq = ++searchSeq;
  const q = (term || "").trim();
  if (q.length < 2){ closeResults(); return; }
  openResults('<div class="res none">' + esc(t("searching")) + '</div>');
  try{
    const r = await fetch(GEO + "?name=" + encodeURIComponent(q) + "&count=6&language=" + GEO_LANG + "&format=json");
    if (!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json();
    if (seq !== searchSeq) return;
    const list = (j && j.results) || [];
    if (!list.length){
      openResults('<div class="res none">' + esc(t("noCity", { q: q })) + '</div>');
      return;
    }
    openResults(list.map((p, i) =>
      '<div class="res" role="option" data-i="' + i + '"><span class="nm">' + esc(p.name) + '</span>' +
      '<span class="rg">' + esc([p.admin1, p.country].filter(Boolean).join(", ")) + '</span></div>').join(""));
    resBox.querySelectorAll(".res[data-i]").forEach(el => el.onclick = () => {
      const p = list[+el.dataset.i];
      choose({ name: p.name, admin: p.admin1 || "", country: p.country || "", lat: p.latitude, lon: p.longitude });
    });
  }catch(e){
    if (seq !== searchSeq) return;
    openResults('<div class="res none">' + t("searchErr", {
      why: esc(e && e.message ? e.message : t("errNet")),
      refresh: esc(t("refresh"))
    }) + '</div>');
  }
}

qEl.addEventListener("input", () => {
  clearTimeout(searchTimer);
  const v = qEl.value;
  searchTimer = setTimeout(() => runSearch(v), 260);
});
qEl.addEventListener("keydown", e => {
  const items = Array.from(resBox.querySelectorAll(".res[data-i]"));
  if (!items.length) return;
  let i = items.findIndex(x => x.classList.contains("active"));
  if (e.key === "ArrowDown" || e.key === "ArrowUp"){
    e.preventDefault();
    i = e.key === "ArrowDown" ? (i + 1) % items.length : (i - 1 + items.length) % items.length;
    items.forEach(x => x.classList.remove("active"));
    items[i].classList.add("active");
    items[i].scrollIntoView({ block: "nearest" });
  } else if (e.key === "Enter" && i >= 0){
    e.preventDefault();
    items[i].click();
  } else if (e.key === "Escape"){
    closeResults();
    qEl.blur();
  }
});
document.addEventListener("click", e => { if (!e.target.closest || !e.target.closest(".search")) closeResults(); });

/* ---------- controls ---------- */
function unit(u){
  state.unit = u;
  document.getElementById("uF").setAttribute("aria-pressed", String(u === "F"));
  document.getElementById("uC").setAttribute("aria-pressed", String(u === "C"));
  document.getElementById("leg-temp").textContent = t("legTemp", { u: "°" + u });
  if (state.data) renderAll();
}
document.getElementById("uF").onclick = () => unit("F");
document.getElementById("uC").onclick = () => unit("C");
document.getElementById("reload").onclick = load;
document.querySelectorAll("[data-span]").forEach(b => b.onclick = () => {
  state.span = +b.dataset.span;
  document.querySelectorAll("[data-span]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  if (state.data) renderChart();
});

applyStatic();
renderChips();
unit(state.unit);
choose(HOME);
state.timer = setInterval(load, 600000);
})();
</script>
