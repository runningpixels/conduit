[package]
name = "mcp-runtime"
description = "Transport-agnostic Model Context Protocol runtime core for Conduit."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1"
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.40", features = ["process", "io-util", "time", "sync", "macros", "rt", "net"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
uuid = { version = "1.11", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
# PermissionLevel (the consent tier enum) is the canonical schema, owned by
# provider-core. mcp-runtime re-exports it so consent classification has one
# source of truth; the transport/protocol layer otherwise stays independent of
# the provider stack.
provider-core = { path = "../provider-core" }

[dev-dependencies]
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "time", "io-util", "net"] }

# Fixture connector binary used by the transport integration test
# (`tests/stdio_fixture.rs`). Built via `CARGO_BIN_EXE_echo_connector`.
[[bin]]
name = "echo_connector"
path = "src/bin/echo_connector.rs"