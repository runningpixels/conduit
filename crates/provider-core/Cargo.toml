[package]
name = "provider-core"
description = "Provider-agnostic LLM abstraction and streaming adapters for Conduit."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
async-stream = "0.3"
async-trait = "0.1"
bytes = "1.9"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
# C1: ts-rs generates the TypeScript schema package from this crate's Rust
# types. Rust is the executable source of truth; the TS in
# `packages/config-schema/src/generated` is regenerated by `cargo run --example
# export_ts` and must never be hand-edited.
ts-rs = { version = "10", features = ["serde-json-impl", "no-serde-warnings"] }
tokio = { version = "1.40", features = ["sync", "macros", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
url = "2.5"
uuid = { version = "1.11", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1.40", features = ["macros", "rt-multi-thread"] }
